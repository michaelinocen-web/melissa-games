<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Melissa's Money Adventures</title>
<style>
:root{
  --bg:#FFF7E8; --bg2:#FFEFD1; --card:#FFFFFF; --line:#F0DCB0;
  --ink:#4A3520; --ink-soft:#8A7350;
  --accent:#3CAA6B; --accent-shadow:#2A7D4C;
  --coral:#FF8A5B; --coral-shadow:#D9683A;
  --gold:#FFC93C; --gold-shadow:#D9A31C;
  --ok:#3CAA6B; --warn:#E85D5D;
  --font-display:'Baloo 2','Trebuchet MS','Verdana',sans-serif;
  --font-body:'Nunito','Trebuchet MS','Verdana',sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:19px; line-height:1.45; overflow-x:hidden; position:relative; }
body::before{ content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(255,201,60,.25), transparent 60%); pointer-events:none; z-index:0; }

h1,h2{ font-family:var(--font-display); font-weight:700; margin:0 0 .3em; }
.big-text{ font-size:1.06rem; font-weight:600; }
svg{ display:block; margin:0 auto; max-width:100%; }

.deck-viewport{ max-width:700px; margin:0 auto; padding:2.1rem 1.2rem 3rem; perspective:1400px; min-height:100vh; position:relative; z-index:1; }
.session{ display:none; text-align:center; }
.session.active{ display:block; }
@keyframes flipOutLeft{ to{ transform:rotateY(-95deg); opacity:0; } }
@keyframes flipOutRight{ to{ transform:rotateY(95deg); opacity:0; } }
@keyframes flipInRight{ from{ transform:rotateY(95deg); opacity:0;} to{transform:rotateY(0deg); opacity:1;} }
@keyframes flipInLeft{ from{ transform:rotateY(-95deg); opacity:0;} to{transform:rotateY(0deg); opacity:1;} }
.leaving-next{ animation:flipOutLeft .22s ease-in forwards; }
.leaving-prev{ animation:flipOutRight .22s ease-in forwards; }
.entering-next{ animation:flipInRight .22s ease-out forwards; }
.entering-prev{ animation:flipInLeft .22s ease-out forwards; }

.hero h1{ font-size:clamp(1.6rem,6vw,2.3rem); color:var(--coral-shadow); }
.hi-name{ font-family:var(--font-display); font-weight:700; color:var(--accent-shadow); font-size:1.2rem; margin-bottom:.2rem; }
.hero p{ font-size:1rem; color:var(--ink-soft); max-width:500px; margin:0 auto; }

.journey-hub-grid{ display:flex; flex-direction:column; gap:1.3rem; max-width:440px; margin:1.4rem auto; }
.journey-card{ position:relative; border:3px solid var(--line); border-radius:26px; padding:1.3rem 1.2rem 1.1rem 1.5rem; box-shadow:0 8px 0 var(--line); cursor:pointer; text-align:left; overflow:hidden; transition:transform .12s ease; }
.journey-card:active{ transform:translateY(3px); box-shadow:0 4px 0 var(--line); }
.journey-card.locked{ opacity:.55; cursor:default; }
.journey-card.locked:active{ transform:none; box-shadow:0 8px 0 var(--line); }
.journey-card.bike-theme{ background:linear-gradient(150deg,#FFF3E9,#FFE1CC); }
.journey-card.dollhouse-theme{ background:linear-gradient(150deg,#FDEFF5,#FBDCEA); }
.journey-card.world-theme{ background:linear-gradient(150deg,#EAF5FF,#D6EBFF); }
.journey-card.orchard-theme{ background:linear-gradient(150deg,#F5EFDC,#E8DEC0); }

/* ============ ORCHARD JOURNEY: fresh visual identity ============ */
:root{
  --orch-bg:#FBF6EA; --orch-green:#2D5F3F; --orch-green-light:#4F8C63; --orch-green-pale:#DCEBDD;
  --orch-amber:#C97B4A; --orch-amber-shadow:#A85F35; --orch-gold:#D4A24C; --orch-gold-shadow:#AD7E2E;
  --orch-brown:#6B4226; --orch-cream:#FBF6EA; --orch-ink:#3A2E1F; --orch-ink-soft:#6B5D48;
  --orch-red:#B5533C;
}
.orchard-scope{ background:var(--orch-bg); color:var(--orch-ink); }
.orchard-scope h1, .orchard-scope h2{ color:var(--orch-green); font-family:var(--font-display); }
.orchard-scope .big-text{ color:var(--orch-ink-soft); }
.orch-card{ background:#fff; border:3px solid var(--orch-green); border-radius:20px; padding:1.2rem 1.1rem; box-shadow:0 6px 0 var(--orch-green); margin:.9rem 0; position:relative; overflow:hidden; }
.orch-btn{ font-family:var(--font-display); font-weight:800; background:var(--orch-green); color:#fff; border:none; border-radius:16px; padding:.75rem 1.4rem; font-size:.95rem; box-shadow:0 4px 0 var(--orch-green-light); cursor:pointer; transition:transform .1s; }
.orch-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--orch-green-light); }
.orch-btn:disabled{ background:#C9C2AC; box-shadow:0 4px 0 #A9A28C; cursor:default; opacity:.7; }
.orch-btn.amber{ background:var(--orch-amber); box-shadow:0 4px 0 var(--orch-amber-shadow); }
.orch-btn.amber:active{ box-shadow:0 1px 0 var(--orch-amber-shadow); }
.orch-tile{ background:#fff; border:3px solid var(--orch-green); border-radius:14px; padding:.8rem 1rem; cursor:pointer; text-align:center; box-shadow:3px 3px 0 var(--orch-green); font-family:var(--font-display); font-weight:700; color:var(--orch-ink); transition:transform .1s; }
.orch-tile:active{ transform:translateY(2px); box-shadow:1px 1px 0 var(--orch-green); }
.orch-tile.wrong-flash{ animation:orchShake .4s ease; border-color:var(--orch-red); }
.orch-reveal{ background:var(--orch-green-pale); border-left:4px solid var(--orch-green); border-radius:10px; padding:.8rem 1rem; margin-top:.8rem; font-size:.88rem; color:var(--orch-ink); opacity:0; max-height:0; overflow:hidden; transition:opacity .35s ease, max-height .35s ease, padding .35s ease; }
.orch-reveal.shown{ opacity:1; max-height:400px; padding:.8rem 1rem; }
.orch-reveal.wrong{ background:#FBE7E2; border-left-color:var(--orch-red); }
.orch-stage-label{ font-family:var(--font-display); font-weight:800; color:var(--orch-brown); font-size:.85rem; text-align:center; margin:.4rem 0; }
.orch-journal-card{ max-width:320px; margin:1rem auto 0; padding:1rem; background:#fff; border:3px solid var(--orch-gold); border-radius:16px; box-shadow:0 5px 0 var(--orch-gold-shadow); }
.orch-journal-title{ font-family:var(--font-display); font-weight:800; text-align:center; color:var(--orch-brown); margin-bottom:.5rem; font-size:.9rem; }
.orch-leaf-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; }
.orch-leaf-slot{ aspect-ratio:1; border-radius:10px; border:2px dashed #D9CFA8; display:flex; align-items:center; justify-content:center; opacity:.35; }
.orch-leaf-slot.grown{ opacity:1; border-style:solid; border-color:var(--orch-green); background:var(--orch-green-pale); }

@keyframes orchShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
@keyframes orchSprout{ 0%{transform:scale(0) translateY(10px); opacity:0;} 60%{transform:scale(1.15) translateY(-3px); opacity:1;} 100%{transform:scale(1) translateY(0); opacity:1;} }
@keyframes orchSway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
@keyframes orchGrow{ from{ height:0; } to{ height:var(--grow-h,100%); } }
@keyframes orchCoinDrop{ 0%{ transform:translateY(-30px) scale(.6); opacity:0; } 60%{ opacity:1; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
@keyframes orchPulseRing{ 0%{ box-shadow:0 0 0 0 rgba(45,95,63,.35); } 100%{ box-shadow:0 0 0 14px rgba(45,95,63,0); } }
@keyframes orchFlip{ 0%{ transform:rotateY(0deg); } 50%{ transform:rotateY(90deg); } 100%{ transform:rotateY(0deg); } }
@keyframes orchRise{ 0%{ transform:translateY(18px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }
@keyframes orchDrift{ 0%{ transform:translateX(-6px) translateY(0); } 50%{ transform:translateX(6px) translateY(-3px); } 100%{ transform:translateX(-6px) translateY(0); } }
@keyframes orchFadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes orchPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
@keyframes orchDragHint{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }
.orch-sprout-in{ animation:orchSprout .5s cubic-bezier(.34,1.56,.64,1); }
.orch-sway{ animation:orchSway 3.5s ease-in-out infinite; transform-origin:bottom center; }
.orch-coin-in{ animation:orchCoinDrop .45s ease-out; }
.orch-pulse{ animation:orchPulseRing 1.2s ease-out; }
.orch-flip{ animation:orchFlip .5s ease; }
.orch-rise-in{ animation:orchRise .45s cubic-bezier(.2,.8,.3,1); }
.orch-drift{ animation:orchDrift 3s ease-in-out infinite; }
.orch-fade-in{ animation:orchFadeIn .5s ease; }
.orch-pop{ animation:orchPop .4s cubic-bezier(.34,1.56,.64,1); }
.orch-drag-hint{ animation:orchDragHint 1.1s ease-in-out infinite; }
.orch-drop-zone{ border:3px dashed #C9C2AC; border-radius:16px; transition:border-color .2s ease, background .2s ease; }
.orch-drop-zone.drag-over{ border-color:var(--orch-green); background:var(--orch-green-pale); }
.journey-card-top{ display:flex; align-items:center; gap:.85rem; }
.journey-icon-badge{ width:68px; height:68px; border-radius:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:2rem; box-shadow:0 4px 0 rgba(0,0,0,.15); transform:rotate(-6deg); border:3px solid #fff; }
.journey-card-title{ font-family:var(--font-display); font-weight:800; font-size:1.15rem; margin-bottom:.1rem; }
.journey-card-desc{ font-size:.8rem; color:var(--ink-soft); line-height:1.3; }
.journey-dots-row{ display:flex; gap:.28rem; margin-top:.7rem; flex-wrap:wrap; align-items:center; }
.journey-dot{ width:15px; height:15px; border-radius:50%; background:#fff; border:2px solid rgba(0,0,0,.12); flex-shrink:0; }
.journey-dot.filled{ border:2px solid transparent; box-shadow:0 2px 0 rgba(0,0,0,.12); }
.journey-play-btn{ position:absolute; right:1rem; bottom:1rem; width:44px; height:44px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.15); }
.journey-sparkle{ position:absolute; font-size:1.1rem; opacity:.55; pointer-events:none; }
.journey-new-ribbon{ position:absolute; top:10px; right:-30px; background:var(--coral); color:#fff; font-family:var(--font-display); font-weight:800; font-size:.68rem; padding:.25rem 2.2rem; transform:rotate(38deg); box-shadow:0 2px 4px rgba(0,0,0,.2); }
.journey-card.locked .journey-play-btn{ display:none; }
.badge-case-card{ max-width:420px; margin:1.2rem auto 0; padding:.9rem 1rem; background:var(--card); border:3px solid var(--line); border-radius:18px; box-shadow:0 5px 0 var(--line); }
.badge-case-title{ font-family:var(--font-display); font-weight:800; font-size:.9rem; text-align:center; margin-bottom:.5rem; color:var(--coral-shadow); }
.badge-case-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(56px,1fr)); gap:.5rem; }
.passport-card{ max-width:320px; margin:1rem auto 0; padding:1rem; background:linear-gradient(160deg,#EAF5FF,#D6EBFF); border:3px solid #5AA9E6; border-radius:16px; box-shadow:0 5px 0 #4A90D0; }
.passport-title{ font-family:var(--font-display); font-weight:800; text-align:center; color:#2C5F8A; margin-bottom:.5rem; }
.passport-stamps-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; }
.passport-stamp{ aspect-ratio:1; border-radius:8px; border:2px dashed #A8C8E8; display:flex; align-items:center; justify-content:center; font-size:1.3rem; opacity:.3; }
.passport-stamp.stamped{ opacity:1; border-style:solid; border-color:#5AA9E6; background:#fff; transform:rotate(-4deg); box-shadow:0 2px 0 rgba(0,0,0,.1); }
.money-badge{ display:flex; flex-direction:column; align-items:center; gap:.15rem; opacity:.3; }
.money-badge.unlocked{ opacity:1; }
.money-badge-icon{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--line); }
.money-badge-label{ font-size:.55rem; font-weight:700; text-align:center; line-height:1.1; }

.finale{ background:linear-gradient(160deg,#FFFFFF,#FFF3D6); border-radius:24px; padding:2.2rem 1.2rem; border:2px solid var(--gold); box-shadow:0 10px 0 var(--line); }
.finale h2{ color:var(--coral-shadow); }

.card{ background:var(--card); border:2px solid var(--line); border-radius:22px; padding:1.3rem 1.2rem; box-shadow:0 6px 0 var(--line); margin:.9rem 0; position:relative; overflow:hidden; }
.chapter-badge{ font-family:var(--font-display); font-size:.72rem; color:var(--coral-shadow); background:rgba(255,138,91,.12); display:inline-block; padding:.28rem .8rem; border-radius:999px; margin-bottom:.5rem; letter-spacing:.02em; }
.tap-hint{ font-family:var(--font-display); font-size:.82rem; color:var(--accent-shadow); margin-top:.45rem; }
.reveal{ display:none; margin-top:.7rem; font-size:.92rem; background:rgba(60,170,107,.09); border-radius:14px; padding:.75rem; text-align:left; }
.reveal.wrong{ background:rgba(232,93,93,.12); }
.reveal.shown{ display:block; }

.card-nav{ display:flex; justify-content:center; gap:.6rem; margin-top:1.2rem; flex-wrap:wrap; }
.nav-btn{ font-family:var(--font-display); font-size:.92rem; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:.6rem 1.2rem; cursor:pointer; box-shadow:0 4px 0 var(--accent-shadow); font-weight:700; }
.nav-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-shadow); }
.nav-btn:disabled{ opacity:.3; cursor:default; box-shadow:none; }
.nav-btn.back-btn{ background:transparent; color:var(--ink-soft); border:2px solid var(--line); box-shadow:none; }
.nav-btn.map-btn{ background:transparent; color:var(--coral-shadow); border:2px dashed var(--coral); box-shadow:none; }
.action-btn{ font-family:var(--font-display); font-size:.95rem; background:var(--gold); color:#5A3E00; border:none; border-radius:14px; padding:.6rem 1.2rem; margin:.3rem; cursor:pointer; box-shadow:0 5px 0 var(--gold-shadow); font-weight:700; }
.action-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--gold-shadow); }

.top-bar-wrap{ position:fixed; top:0; left:0; right:0; max-width:700px; margin:0 auto; height:0; z-index:50; pointer-events:none; }
.exit-btn{ position:absolute; top:.75rem; left:1.2rem; font-family:var(--font-display); font-weight:700; background:var(--card); color:var(--accent-shadow); border:2px solid var(--accent); border-radius:14px; padding:.32rem .85rem; font-size:.82rem; text-decoration:none; pointer-events:auto; }
.progress-pill{ position:absolute; top:.75rem; right:1.2rem; font-family:var(--font-display); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:.3rem .75rem; font-size:.82rem; color:var(--coral-shadow); font-weight:700; pointer-events:auto; }
.bikefund-pill{ position:absolute; top:2.9rem; right:1.2rem; font-family:var(--font-display); background:var(--gold); border:2px solid var(--gold-shadow); border-radius:14px; padding:.3rem .8rem; font-size:.78rem; color:#5A3E00; font-weight:700; white-space:nowrap; pointer-events:auto; }

/* ---------- home: adventure trail map ---------- */
.goal-card{ background:linear-gradient(160deg,#fff,#FFF3D6); border:3px solid var(--gold); border-radius:22px; padding:1.1rem; margin:.8rem 0 1.4rem; box-shadow:0 6px 0 var(--gold-shadow); }
.goal-card-top{ display:flex; align-items:center; gap:.8rem; justify-content:center; }
.goal-card-title{ font-family:var(--font-display); font-weight:700; font-size:.95rem; color:var(--coral-shadow); }
.goal-track{ width:100%; height:18px; border-radius:999px; background:var(--bg2); border:2px solid var(--line); margin-top:.6rem; overflow:hidden; }
.goal-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .6s ease; }
.goal-amounts{ display:flex; justify-content:space-between; font-family:var(--font-display); font-size:.72rem; color:var(--ink-soft); margin-top:.3rem; }
.journey-track-wrap{ position:relative; margin-top:2.6rem; }
.journey-marker{ position:absolute; bottom:100%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; transition:left .6s ease; }
.journey-marker-badge{ width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 0 rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
@keyframes journeyArrowBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(4px);} }
.journey-arrow{ width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid var(--gold-shadow); animation:journeyArrowBounce 1s infinite ease-in-out; margin-top:1px; }
.journey-marker.goal-marker .journey-arrow{ border-top-color:#5A87A8; }

.trail-wrap{ position:relative; padding:.3rem 0 .5rem; }
.trail-page{ display:grid; grid-template-columns:repeat(3, 1fr); gap:1rem .5rem; position:relative; }
.trail-connector-svg{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:visible; }
.trail-stop{ display:flex; flex-direction:column; align-items:center; gap:.3rem; position:relative; }
.trail-badge-btn{ background:none; border:none; cursor:pointer; flex-shrink:0; position:relative; z-index:1; padding:0; }
.trail-badge-btn:active{ transform:scale(.93); }
.trail-badge{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:4px solid #fff; box-shadow:0 5px 0 rgba(0,0,0,.15); position:relative; }
.trail-badge.big{ width:76px; height:76px; }
.trail-check{ position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:50%; background:var(--ok); border:3px solid #fff; display:flex; align-items:center; justify-content:center; }
.trail-num{ font-family:var(--font-display); font-size:.62rem; color:var(--ink-soft); font-weight:700; }
.trail-name{ font-family:var(--font-display); font-weight:700; font-size:.76rem; color:var(--ink); text-align:center; line-height:1.15; }
.trail-status{ font-family:var(--font-display); font-size:.6rem; color:var(--ok); }
@keyframes badgePop{ from{ transform:scale(0); opacity:0;} to{ transform:scale(1); opacity:1;} }
.trail-badge-btn{ animation:badgePop .35s ease backwards; }
.trail-pager{ display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1.1rem; }
.trail-pager-btn{ font-family:var(--font-display); font-weight:700; background:var(--accent); color:#fff; border:none; border-radius:12px; width:38px; height:38px; cursor:pointer; box-shadow:0 3px 0 var(--accent-shadow); font-size:1.1rem; }
.trail-pager-btn:disabled{ opacity:.25; cursor:default; box-shadow:none; }
.trail-pager-dots{ display:flex; gap:.4rem; }
.trail-pager-dot{ width:9px; height:9px; border-radius:50%; background:var(--line); }
.trail-pager-dot.active{ background:var(--coral); }

/* ---------- finger hint: pure CSS caret ---------- */
@keyframes fingerTap{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,10px); } }
.finger-hint{
  position:absolute; width:0; height:0; pointer-events:none; z-index:6;
  border-left:11px solid transparent; border-right:11px solid transparent; border-top:16px solid var(--coral);
  animation:fingerTap 1s infinite ease-in-out;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));
}

.tap-circle{ cursor:pointer; }
.pulse{ animation:pulse 1.6s infinite ease-in-out; }
@keyframes pulse{ 0%,100%{ filter:drop-shadow(0 0 5px currentColor);} 50%{ filter:drop-shadow(0 0 16px currentColor);} }
@keyframes popIn{ from{ transform:scale(0); opacity:0;} to{ transform:scale(1); opacity:1;} }
@keyframes coinBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }

/* ---------- ambient/idle motion so nothing sits still ---------- */
@keyframes idleBob{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-7px) rotate(-3deg);} }
.idle-bob{ animation:idleBob 2.6s infinite ease-in-out; }
@keyframes idleWobble{ 0%,100%{ transform:rotate(-2deg);} 50%{ transform:rotate(2deg);} }
.idle-wobble{ animation:idleWobble 2.2s infinite ease-in-out; transform-origin:bottom center; }
@keyframes idleSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
.idle-spin{ animation:idleSpin 6s linear infinite; transform-origin:center; }
@keyframes idleGlow{ 0%,100%{ opacity:0.5;} 50%{ opacity:1;} }
.idle-glow{ animation:idleGlow 2s infinite ease-in-out; }
@keyframes floatUp{ 0%{ transform:translateY(0) rotate(0deg); opacity:0;} 10%{opacity:.7;} 90%{opacity:.5;} 100%{ transform:translateY(-140px) rotate(180deg); opacity:0;} }
.floating-coin{ position:absolute; pointer-events:none; animation:floatUp 6s linear infinite; }
.ambient-field{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }

/* ---------- speech bubble ---------- */
@keyframes bubblePop{ 0%{ transform:scale(.7); opacity:0;} 60%{ transform:scale(1.05); opacity:1;} 100%{ transform:scale(1); opacity:1;} }
.speech-bubble{ background:#fff; border:3px solid var(--gold); border-radius:20px; padding:.9rem 1.1rem; position:relative; text-align:left; animation:bubblePop .4s ease; box-shadow:0 4px 0 var(--line); }
.speech-bubble::after{ content:''; position:absolute; left:32px; bottom:-14px; width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:14px solid var(--gold); }
.speech-bubble::before{ content:''; position:absolute; left:34px; bottom:-9px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:11px solid #fff; z-index:1; }

/* ---------- real drag-and-drop ---------- */
.draggable{ cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; position:relative; z-index:3; pointer-events:auto; -webkit-user-drag:none; }
.draggable img, .draggable svg{ pointer-events:none; }
.draggable.dragging{ cursor:grabbing; z-index:20; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)); transition:none !important; }
.drop-zone{ transition:background .2s, transform .2s; }
.drop-zone.drag-over{ background:rgba(60,170,107,.18) !important; transform:scale(1.03); }
@keyframes dropSettle{ 0%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
.drop-settled{ animation:dropSettle .3s ease; }

/* ---------- question tiles ---------- */
.qtile-row{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-top:.9rem; }
.qtile{ background:var(--bg2); border:3px solid var(--line); border-radius:16px; padding:.8rem; width:130px; cursor:pointer; text-align:center; }
.qtile:active{ transform:scale(.96); }
.qtile.yes{ border-color:var(--ok); background:rgba(60,170,107,.14); }
.qtile.no{ border-color:var(--warn); background:rgba(232,93,93,.12); }
.qtile-icon{ height:52px; display:flex; align-items:center; justify-content:center; }
.qtile-text{ font-family:var(--font-display); font-size:.82rem; font-weight:700; margin-top:.4rem; }

/* ---------- true/false lever ---------- */
.lever-track{ width:200px; height:60px; background:var(--bg2); border:3px solid var(--line); border-radius:999px; margin:1rem auto; position:relative; }
.lever-zone{ position:absolute; top:0; width:50%; height:100%; }
.lever-zone.left{ left:0; border-radius:999px 0 0 999px; }
.lever-zone.right{ right:0; border-radius:0 999px 999px 0; }
.lever-knob{ width:54px; height:54px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 55%,var(--gold-shadow)); border:3px solid #fff; position:absolute; top:0; left:calc(50% - 27px); transition:left .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 3px 6px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:#5A3E00; z-index:2; }
.lever-label{ position:absolute; top:50%; transform:translateY(-50%); font-family:var(--font-display); font-weight:700; font-size:.85rem; color:var(--ink-soft); }
.lever-label.left{ left:14px; }
.lever-label.right{ right:14px; }

/* ---------- drag-to-jar question ---------- */
.dragq-item{ width:56px; height:56px; margin:0 auto; }
.dragq-zones{ display:flex; justify-content:center; gap:1.2rem; margin-top:1rem; }
.dragq-zone{ width:100px; height:90px; background:var(--bg2); border:3px dashed var(--line); border-radius:16px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.dragq-zone-label{ font-family:var(--font-display); font-weight:700; font-size:.8rem; margin-top:.3rem; }

@keyframes particleFly{ 0%{ transform:translate(0,0) scale(1); opacity:1; } 100%{ transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
.particle{ position:absolute; border-radius:50%; animation:particleFly 1s ease-out forwards; }
.particle-wrap{ position:relative; display:inline-block; min-height:70px; }

.scene{ width:180px; height:180px; border-radius:26px; margin:.6rem auto 1rem; position:relative;
  background:linear-gradient(180deg, #FFF3D6, #FFE7B0);
  border:4px solid var(--gold); box-shadow:0 6px 0 var(--line);
  display:flex; align-items:center; justify-content:center; overflow:visible; }

/* ---------- kid-friendly slider ---------- */
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:40px; background:transparent; margin:1rem 0 .4rem; cursor:pointer; touch-action:pan-y; }
input[type=range]::-webkit-slider-runnable-track{ height:12px; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--gold), var(--coral)); }
input[type=range]::-moz-range-track{ height:12px; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--gold), var(--coral)); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; margin-top:-14px; width:40px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, var(--gold) 55%, var(--gold-shadow) 100%);
  border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.25), 0 0 0 6px rgba(255,201,60,.3); cursor:pointer; transition:transform .15s ease; }
input[type=range]::-moz-range-thumb{ width:40px; height:40px; border-radius:50%; border:3px solid #fff;
  background:radial-gradient(circle at 35% 30%, #ffffff, var(--gold) 55%, var(--gold-shadow) 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.25), 0 0 0 6px rgba(255,201,60,.3); cursor:pointer; transition:transform .15s ease; }
input[type=range]:active::-webkit-slider-thumb{ transform:scale(1.2); }
input[type=range]:active::-moz-range-thumb{ transform:scale(1.2); }
input[type=range]:focus{ outline:none; }
.stage-label{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; color:var(--coral-shadow); margin-top:.2rem; }
.stage-desc{ font-size:.88rem; color:var(--ink-soft); min-height:2em; }

/* ---------- sort activity ---------- */
.sort-bin{ flex:1; background:var(--bg2); border:2px dashed var(--line); border-radius:14px; padding:.6rem; min-height:110px; }
.sort-bin-title{ font-family:var(--font-display); font-weight:700; font-size:.85rem; margin-bottom:.4rem; }
.sort-bin-item{ display:block; font-size:.82rem; padding:.28rem .5rem; margin-bottom:.3rem; border-radius:8px; background:rgba(60,170,107,.1); animation:popIn .3s ease; }
.sort-pool-btn{ font-family:var(--font-display); font-size:.85rem; background:#fff; border:2px solid var(--line); border-radius:12px; padding:.5rem .8rem; cursor:pointer; margin:.2rem; }

/* ---------- comprehension check (light, story-framed) ---------- */
.check-opts{ display:flex; flex-direction:column; gap:.55rem; margin-top:.9rem; }
.check-btn{ font-family:var(--font-display); font-size:.96rem; background:var(--bg2); color:var(--ink); border:3px solid var(--line); border-radius:14px; padding:.62rem .9rem; cursor:pointer; }
.check-btn.yes{ border-color:var(--ok); background:rgba(60,170,107,.14); }
.check-btn.no{ border-color:var(--warn); background:rgba(232,93,93,.12); }
.check-btn:disabled{ cursor:default; }

/* ---------- jars ---------- */
.jar-row{ display:flex; justify-content:center; gap:.7rem; margin:1rem 0; }
.jar{ width:80px; }
.jar-fill{ transition:height .5s ease; }
.jar-label{ font-family:var(--font-display); font-size:.72rem; margin-top:.3rem; color:var(--ink-soft); }
.jar-amount{ font-family:var(--font-display); font-weight:700; font-size:.85rem; color:var(--coral-shadow); }

footer{ text-align:center; padding:1rem 1rem 2rem; font-size:.82rem; color:var(--ink-soft); position:relative; z-index:1; }

.hub-exit-btn{ position:fixed; top:.9rem; right:.9rem; z-index:80; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:.5rem 1rem; font-family:inherit; font-weight:700; color:var(--ink); text-decoration:none; box-shadow:2px 2px 0 var(--line); }
</style>
</head>
<body>

<a href="index.html" class="hub-exit-btn">&#8592; Games Hub</a>

<div class="deck-viewport">
<div id="deck">

  <!-- ============ JOURNEY HUB (TRUE HOME) ============ -->
  <section class="session hub active" data-index="0" data-chapter="hub">
    <div class="hi-name">Hi Melissa</div>
    <h1>Melissa's Money Adventures</h1>
    <p>Choose a journey to continue learning about money!</p>
    <div class="journey-hub-grid" id="journeyHubGrid"></div>
    <div class="badge-case-card" id="badgeCaseCard"></div>
  </section>

</div>
</div>

<footer>Made for Melissa. Based on a ten-lesson money curriculum, sequenced from concrete to abstract.</footer>

<script>
function loadChecksDoneFor(key, length){
  try{
    const v = JSON.parse(localStorage.getItem(key) || 'null');
    if(Array.isArray(v) && v.length === length) return v;
  }catch(e){}
  return Array(length).fill(false);
}
const checksDone = loadChecksDoneFor('melissaMoneyChecksDone_v1', 11);
const dollhouseChecksDone = loadChecksDoneFor('melissaMoneyDollhouseChecksDone_v1', 10);
const worldChecksDone = loadChecksDoneFor('melissaMoneyWorldChecksDone_v1', 14);
const orchardChecksDone = loadChecksDoneFor('melissaMoneyOrchardChecksDone_v1', 13);

function renderJourneyHub(){
  const grid = document.getElementById('journeyHubGrid');
  if(!grid) return;
  const dotsHTML = (doneArr, color) => doneArr.map(d=>`<div class="journey-dot ${d?'filled':''}" style="${d?`background:${color};`:''}"></div>`).join('');
  const playArrow = `<svg width="18" height="18" viewBox="0 0 20 20"><path d="M6 3 L16 10 L6 17 Z" fill="#5A3E20"/></svg>`;
  grid.innerHTML = `
    <div class="journey-card bike-theme" onclick="window.location.href='money-matters-bike.html'">
      <div class="journey-sparkle" style="top:10px; right:60px;">&#10024;</div>
      <div class="journey-card-top">
        <div class="journey-icon-badge" style="background:#FF8A5B;">&#128690;</div>
        <div>
          <div class="journey-card-title">The Bike Journey</div>
          <div class="journey-card-desc">Earning, saving, and one very special bike.</div>
        </div>
      </div>
      <div class="journey-dots-row">${dotsHTML(checksDone,'#FF8A5B')}</div>
      <div class="journey-play-btn">${playArrow}</div>
    </div>
    <div class="journey-card dollhouse-theme" onclick="window.location.href='money-matters-dollhouse.html'">
      <div class="journey-sparkle" style="top:8px; right:70px;">&#127881;</div>
      <div class="journey-sparkle" style="bottom:14px; right:20px; font-size:.8rem;">&#10024;</div>
      <div class="journey-card-top">
        <div class="journey-icon-badge" style="background:#E88FB0;">&#127968;</div>
        <div>
          <div class="journey-card-title">The Dollhouse Journey</div>
          <div class="journey-card-desc">Saving, shopping, and building your dream dollhouse!</div>
        </div>
      </div>
      <div class="journey-dots-row">${dotsHTML(dollhouseChecksDone,'#E88FB0')}</div>
      <div class="journey-play-btn">${playArrow}</div>
    </div>
    <div class="journey-card world-theme" onclick="window.location.href='money-matters-starland.html'">
      <div class="journey-sparkle" style="top:8px; right:65px;">&#127760;</div>
      <div class="journey-card-top">
        <div class="journey-icon-badge" style="background:#5AA9E6;">&#128081;</div>
        <div>
          <div class="journey-card-title">Melissa's Starland</div>
          <div class="journey-card-desc">Rule your own country with Azul as your royal advisor!</div>
        </div>
      </div>
      <div class="journey-dots-row">${dotsHTML(worldChecksDone,'#5AA9E6')}</div>
      <div class="journey-play-btn">${playArrow}</div>
    </div>
    <div class="journey-card orchard-theme" onclick="window.location.href='money-matters-orchard.html'">
      <div class="journey-card-top">
        <div class="journey-icon-badge" style="background:var(--orch-green);">
          <svg width="30" height="30" viewBox="0 0 44 44"><circle cx="22" cy="16" r="12" fill="#fff"/><rect x="19" y="24" width="6" height="14" rx="1.5" fill="#fff"/></svg>
        </div>
        <div>
          <div class="journey-card-title">The Orchard</div>
          <div class="journey-card-desc">Grow your money like a garden \u2014 with Hazel as your guide.</div>
        </div>
      </div>
      <div class="journey-dots-row">${dotsHTML(orchardChecksDone,'var(--orch-green)')}</div>
      <div class="journey-play-btn">${playArrow}</div>
    </div>`;
  renderBadgeCase();
}
const HOME_BADGES = [
  {id:'first', label:'First Steps', icon:'&#127775;', color:'#FFC93C', test:(b,d)=> (b+d) >= 1},
  {id:'gettinggood', label:'Getting Good!', icon:'&#128170;', color:'#5AA9E6', test:(b,d)=> (b+d) >= 5},
  {id:'halfway', label:'Halfway Hero', icon:'&#127942;', color:'#4FBF8F', test:(b,d)=> (b+d) >= 10},
  {id:'bikechamp', label:'Bike Champion', icon:'&#128690;', color:'#FF8A5B', test:(b,d,bt)=> b >= bt},
  {id:'dollhousechamp', label:'Dollhouse Champion', icon:'&#127968;', color:'#E88FB0', test:(b,d,bt,dt)=> d >= dt},
  {id:'moneymaster', label:'Money Master', icon:'&#128142;', color:'#9B7FD4', test:(b,d,bt,dt)=> b>=bt && d>=dt}
];
function renderBadgeCase(){
  const card = document.getElementById('badgeCaseCard');
  if(!card) return;
  const b = checksDone.filter(Boolean).length, bt = checksDone.length;
  const d = dollhouseChecksDone.filter(Boolean).length, dt = dollhouseChecksDone.length;
  const badgesHTML = HOME_BADGES.map(badge=>{
    const unlocked = badge.test(b,d,bt,dt);
    return `<div class="money-badge ${unlocked?'unlocked':''}">
      <div class="money-badge-icon" style="background:${unlocked?badge.color:'#eee'};">${badge.icon}</div>
      <div class="money-badge-label">${badge.label}</div>
    </div>`;
  }).join('');
  card.innerHTML = `<div class="badge-case-title">Money Smarts Badges</div><div class="badge-case-grid" id="badgeCaseGrid">${badgesHTML}</div>`;
}
renderJourneyHub();
</script>
</body>
</html>
