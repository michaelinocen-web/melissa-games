<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1B3A; --bg2:#25254A; --card:#2A2A52; --line:#4A4A80;
  --ink:#F0ECE0; --ink-soft:#ABA6D4;
  --coral:#E88FA8; --coral-shadow:#C46B85;
  --sage:#7FD9C4; --sage-shadow:#4FA890;
  --plum:#B39DDB; --plum-shadow:#8B6FB8;
  --gold:#F4C95D; --gold-shadow:#D4A030;
  --sky:#8AB4E8; --sky-shadow:#5D85C4;
  --page:#F6EFDD; --page-ink:#3A3352;
  --font-display:'Fredoka','Trebuchet MS','Verdana',sans-serif;
  --font-body:'Fredoka','Trebuchet MS','Verdana',sans-serif;
  --font-story:'Lora',Georgia,serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:19px; line-height:1.5; overflow-x:hidden; position:relative; }
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(2px 2px at 10% 15%, rgba(244,201,93,.9), transparent),
    radial-gradient(1.5px 1.5px at 25% 8%, rgba(255,255,255,.7), transparent),
    radial-gradient(2px 2px at 40% 22%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 60% 6%, rgba(244,201,93,.8), transparent),
    radial-gradient(2px 2px at 75% 18%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 88% 10%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 15% 40%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 92% 45%, rgba(244,201,93,.7), transparent),
    radial-gradient(ellipse at 50% 0%, rgba(139,111,184,.28), transparent 65%);
  animation:scTwinkle 4s ease-in-out infinite;
}
@keyframes scTwinkle{ 0%,100%{ opacity:1; } 50%{ opacity:.65; } }
h1,h2{ font-family:var(--font-display); font-weight:600; margin:0 0 .3em; color:var(--gold); }
svg{ display:block; margin:0 auto; max-width:100%; }

.viewport{ max-width:640px; margin:0 auto; padding:1.6rem 1.1rem 3rem; min-height:100vh; position:relative; z-index:1; }
.screen{ display:none; }
.screen.active{ display:block; }

@keyframes scRise{ from{ transform:translateY(22px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
@keyframes scFade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes scPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
@keyframes scFlip{ 0%{ transform:rotateY(0deg); } 50%{ transform:rotateY(92deg); } 100%{ transform:rotateY(0deg); } }
@keyframes scPanIn{ from{ transform:translateX(28px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
@keyframes scSway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
@keyframes scBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
@keyframes scShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
@keyframes scStarPop{ 0%{ transform:scale(0) rotate(-20deg); opacity:0; } 60%{ transform:scale(1.3) rotate(8deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }
@keyframes scSpin{ from{ transform:rotate(0deg) scale(.4); opacity:0; } to{ transform:rotate(360deg) scale(1); opacity:1; } }
@keyframes scPopUp{ 0%{ transform:translateY(14px) scale(.7); opacity:0; } 70%{ transform:translateY(-4px) scale(1.06); opacity:1; } 100%{ transform:translateY(0) scale(1); opacity:1; } }
@keyframes scGlow{ 0%,100%{ box-shadow:0 0 12px 2px rgba(244,201,93,.35); } 50%{ box-shadow:0 0 20px 5px rgba(244,201,93,.55); } }
@keyframes scRoll{ 0%{ transform:translateX(-18px) rotate(0deg); } 100%{ transform:translateX(18px) rotate(360deg); } }
@keyframes scLoopFly{ 0%{ transform:translate(-16px,6px) rotate(0deg); } 25%{ transform:translate(-6px,-16px) rotate(90deg); } 50%{ transform:translate(16px,-6px) rotate(180deg); } 75%{ transform:translate(6px,12px) rotate(270deg); } 100%{ transform:translate(-16px,6px) rotate(360deg); } }
@keyframes scSwoopIn{ 0%{ transform:translate(26px,-30px) rotate(-18deg); opacity:0; } 70%{ transform:translate(-4px,4px) rotate(4deg); opacity:1; } 100%{ transform:translate(0,0) rotate(0deg); opacity:1; } }
@keyframes scFlop{ 0%{ transform:rotate(0deg) translateY(0); } 30%{ transform:rotate(-25deg) translateY(-6px); } 60%{ transform:rotate(15deg) translateY(4px); } 100%{ transform:rotate(0deg) translateY(0); } }
@keyframes scJumpSplash{ 0%{ transform:translateY(0) scaleY(1); } 30%{ transform:translateY(-22px) scaleY(1.08); } 55%{ transform:translateY(-22px) scaleY(1); } 100%{ transform:translateY(0) scaleY(.92); } }
@keyframes scWaddle{ 0%,100%{ transform:translateX(0) rotate(-4deg); } 50%{ transform:translateX(10px) rotate(4deg); } }
@keyframes scCurlUp{ 0%,100%{ transform:scale(1); } 40%{ transform:scale(.72); } 60%{ transform:scale(.72); } }
@keyframes scShakeOff{ 0%,100%{ transform:rotate(0deg); } 20%{ transform:rotate(-8deg); } 40%{ transform:rotate(8deg); } 60%{ transform:rotate(-6deg); } 80%{ transform:rotate(6deg); } }
@keyframes scCrossWobble{ 0%{ transform:translateX(-20px) rotate(-6deg); } 25%{ transform:translateX(-8px) rotate(6deg); } 50%{ transform:translateX(4px) rotate(-6deg); } 75%{ transform:translateX(14px) rotate(6deg); } 100%{ transform:translateX(20px) rotate(0deg); } }
@keyframes scCheerBounce{ 0%,100%{ transform:translateY(0) scale(1); } 25%{ transform:translateY(-14px) scale(1.05); } 50%{ transform:translateY(0) scale(1); } 75%{ transform:translateY(-8px) scale(1.02); } }
@keyframes scBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
@keyframes scDroop{ 0%{ transform:translateY(0) rotate(0deg); } 100%{ transform:translateY(10px) rotate(-6deg); } }
@keyframes scMarch{ 0%,100%{ transform:translateY(0); } 25%{ transform:translateY(-5px); } 50%{ transform:translateY(0); } 75%{ transform:translateY(-5px); } }
.sc-rise{ animation:scRise .5s cubic-bezier(.2,.8,.3,1); }
.sc-fade{ animation:scFade .5s ease; }
.sc-pop{ animation:scPop .4s cubic-bezier(.34,1.56,.64,1); }
.sc-flip{ animation:scFlip .55s ease; }
.sc-pan-in{ animation:scPanIn .5s cubic-bezier(.2,.8,.3,1); }
.sc-sway{ animation:scSway 3.2s ease-in-out infinite; transform-origin:bottom center; }
.sc-bob{ animation:scBob 2.4s ease-in-out infinite; }
.sc-star-pop{ animation:scStarPop .5s cubic-bezier(.34,1.56,.64,1); }
.sc-spin{ animation:scSpin .6s cubic-bezier(.2,.8,.3,1); }
.sc-pop-up{ animation:scPopUp .5s cubic-bezier(.34,1.56,.64,1); }
.sc-roll{ animation:scRoll .9s ease-in-out; }
.sc-loop-fly{ animation:scLoopFly 1.4s ease-in-out; }
.sc-swoop-in{ animation:scSwoopIn .8s cubic-bezier(.2,.7,.3,1); }
.sc-flop{ animation:scFlop .7s ease-in-out; }
.sc-jump-splash{ animation:scJumpSplash .9s cubic-bezier(.3,.6,.3,1); }
.sc-waddle{ animation:scWaddle 1.2s ease-in-out infinite; }
.sc-curl-up{ animation:scCurlUp 1.6s ease-in-out; }
.sc-shake-off{ animation:scShakeOff .6s ease-in-out; }
.sc-cross-wobble{ animation:scCrossWobble 1.6s ease-in-out; }
.sc-cheer-bounce{ animation:scCheerBounce 1s ease-in-out; }
.sc-breathe{ animation:scBreathe 2.2s ease-in-out infinite; }
.sc-droop{ animation:scDroop 1s ease-out forwards; }
.sc-march{ animation:scMarch .9s ease-in-out infinite; }

/* ---- Hub / Library ---- */
.sc-header{ text-align:center; margin-bottom:1rem; }
.sc-header h1{ font-size:1.9rem; text-shadow:0 0 18px rgba(244,201,93,.4); }
.sc-header p{ color:var(--ink-soft); max-width:480px; margin:0 auto; font-size:1rem; }
.sc-streak-card{ display:flex; align-items:center; gap:.9rem; background:linear-gradient(160deg,var(--card),var(--bg2)); border:1.5px solid var(--gold); border-radius:20px; padding:.9rem 1.1rem; box-shadow:0 0 18px rgba(244,201,93,.22), inset 0 1px 0 rgba(255,255,255,.05); max-width:480px; margin:1rem auto; }
.sc-streak-flame{ flex-shrink:0; filter:drop-shadow(0 0 6px rgba(244,201,93,.6)); }
.sc-streak-text{ font-family:var(--font-display); font-weight:600; color:var(--ink); font-size:1rem; }
.sc-streak-sub{ font-size:.78rem; color:var(--ink-soft); font-weight:500; }
.sc-stars-total{ margin-left:auto; text-align:center; flex-shrink:0; }
.sc-stars-total .num{ font-family:var(--font-display); font-weight:600; font-size:1.3rem; color:var(--gold); text-shadow:0 0 10px rgba(244,201,93,.5); }
.sc-stars-total .lbl{ font-size:.65rem; color:var(--ink-soft); font-weight:600; letter-spacing:.04em; }

.sc-shelf{ display:flex; flex-direction:column; gap:.8rem; max-width:480px; margin:1.2rem auto; }
.sc-volume-grid{ display:flex; flex-direction:column; gap:1rem; max-width:480px; margin:1.2rem auto; }
.sc-volume-card{ position:relative; border-radius:20px; padding:1.1rem 1.2rem; cursor:pointer; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.3); transition:transform .15s; border:1.5px solid rgba(255,255,255,.15); }
.sc-volume-card:active{ transform:translateY(2px) scale(.99); }
.sc-volume-card.locked{ cursor:default; filter:grayscale(.6); opacity:.55; }
.sc-volume-card.locked:active{ transform:none; }
.sc-volume-top{ display:flex; align-items:center; gap:.9rem; }
.sc-volume-number{ font-family:var(--font-display); font-weight:600; font-size:2rem; color:rgba(255,255,255,.5); flex-shrink:0; min-width:2.2rem; text-align:center; }
.sc-volume-info{ flex:1; }
.sc-volume-name{ font-family:var(--font-display); font-weight:600; font-size:1.1rem; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.3); }
.sc-volume-sub{ font-size:.72rem; color:rgba(255,255,255,.75); margin-top:.1rem; }
.sc-volume-lock-badge{ flex-shrink:0; }
.sc-volume-progress-row{ display:flex; align-items:center; gap:.5rem; margin-top:.7rem; }
.sc-volume-progress-track{ flex:1; height:7px; border-radius:4px; background:rgba(0,0,0,.25); overflow:hidden; }
.sc-volume-progress-fill{ height:100%; background:#fff; border-radius:4px; transition:width .3s ease; }
.sc-volume-progress-text{ font-size:.68rem; color:rgba(255,255,255,.85); font-weight:600; white-space:nowrap; }
.sc-volume-icons-row{ display:flex; gap:.35rem; margin-top:.6rem; flex-wrap:wrap; }
.sc-volume-mini-icon{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:.9; }

.sc-batch-header{ display:flex; align-items:center; gap:.6rem; margin:1.2rem 0 .3rem; max-width:480px; margin-left:auto; margin-right:auto; }
.sc-batch-header:first-child{ margin-top:0; }
.sc-batch-title{ font-family:var(--font-display); font-weight:600; font-size:.85rem; color:var(--sky); text-transform:uppercase; letter-spacing:.04em; }
.sc-batch-line{ flex:1; height:1px; background:var(--line); }
.sc-batch-lock-note{ font-size:.72rem; color:var(--ink-soft); max-width:480px; margin:0 auto .6rem; text-align:center; font-style:italic; }
.sc-book.locked{ opacity:.4; cursor:default; }
.sc-book.locked:active{ transform:none; }
.sc-book.planned{ opacity:.35; cursor:default; }
.sc-lock-icon{ margin-left:auto; flex-shrink:0; }
.sc-book{ display:flex; align-items:center; gap:.9rem; background:linear-gradient(160deg,var(--card),var(--bg2)); border:1.5px solid var(--line); border-radius:18px; padding:.8rem 1rem; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); text-align:left; transition:transform .15s, box-shadow .15s; }
.sc-book:active{ transform:translateY(2px) scale(.99); }
.sc-book.read{ border-color:var(--sage); box-shadow:0 0 14px rgba(127,217,196,.25); }
.sc-book-badge{ width:52px; height:52px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(0,0,0,.3), inset 0 -3px 6px rgba(0,0,0,.15); }
.sc-book-title{ font-family:var(--font-display); font-weight:600; font-size:.95rem; color:var(--ink); }
.sc-book-theme{ font-size:.72rem; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
.sc-book-check{ margin-left:auto; flex-shrink:0; }

.sc-badge-case{ max-width:480px; margin:1.4rem auto 0; padding:1rem; background:linear-gradient(160deg,var(--card),var(--bg2)); border:1.5px solid var(--sky); border-radius:18px; box-shadow:0 0 16px rgba(138,180,232,.2); }
.sc-badge-case-title{ font-family:var(--font-display); font-weight:600; text-align:center; color:var(--sky); margin-bottom:.6rem; font-size:.95rem; }
.sc-badge-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(58px,1fr)); gap:.6rem; }
.sc-badge-slot{ display:flex; flex-direction:column; align-items:center; gap:.25rem; opacity:.28; }
.sc-badge-slot.earned{ opacity:1; }
.sc-badge-icon-wrap{ width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 8px rgba(0,0,0,.3); }
.sc-badge-label{ font-size:.58rem; text-align:center; font-weight:600; color:var(--ink-soft); line-height:1.1; }

/* ---- Story reader: an open book glowing in the dark ---- */
.sc-story-card{ background:var(--page); color:var(--page-ink); border-radius:6px 18px 18px 6px; padding:1.4rem 1.3rem; box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 14px 40px rgba(0,0,0,.45), inset 6px 0 12px -8px rgba(0,0,0,.25); position:relative; overflow:hidden; min-height:380px; display:flex; flex-direction:column; }
.sc-story-card::before{ content:''; position:absolute; top:0; bottom:0; left:0; width:10px; background:linear-gradient(90deg, rgba(0,0,0,.18), transparent); }
.sc-story-card::after{ content:''; position:absolute; bottom:0; right:0; width:0; height:0; border-style:solid; border-width:0 0 26px 26px; border-color:transparent transparent rgba(0,0,0,.12) transparent; }
.sc-story-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }
.sc-story-badge-name{ font-family:var(--font-display); font-weight:600; font-size:.82rem; color:var(--plum-shadow); }
.sc-page-dots{ display:flex; gap:.3rem; }
.sc-page-dot{ width:8px; height:8px; border-radius:50%; background:#D9CFB0; }
.sc-page-dot.on{ background:var(--coral-shadow); }
.sc-story-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:.9rem; padding:.5rem 0; }
.sc-story-text{ font-family:var(--font-story); font-size:1.08rem; color:var(--page-ink); max-width:440px; line-height:1.65; }
.sc-char-stage{ height:120px; display:flex; align-items:center; justify-content:center; gap:1rem; }
.sc-char-wrap{ position:relative; cursor:pointer; }
.sc-char-wrap:active{ transform:scale(.96); }
.sc-bubble{ position:absolute; bottom:100%; left:50%; transform:translateX(calc(-50% + var(--shift,0px))) translateY(8px) scale(.8); background:var(--bg2); border:1.5px solid var(--gold); border-radius:14px; padding:.5rem .7rem; font-size:.74rem; font-weight:600; color:var(--ink); white-space:normal; width:max-content; max-width:150px; line-height:1.3; text-align:center; box-shadow:0 0 12px rgba(244,201,93,.3); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:30; }
.sc-bubble::after{ content:''; position:absolute; top:100%; left:calc(50% - var(--shift,0px)); transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--gold); }
.sc-bubble.show{ opacity:1; transform:translateX(calc(-50% + var(--shift,0px))) translateY(0) scale(1); }
.sc-vocab-word{ position:relative; border-bottom:2px dotted var(--coral-shadow); cursor:pointer; padding-bottom:1px; }
.sc-vocab-bubble{ position:absolute; bottom:100%; left:50%; transform:translateX(calc(-50% + var(--shift,0px))) translateY(6px) scale(.85); background:var(--bg2); color:var(--ink); border:1.5px solid var(--coral); border-radius:12px; padding:.5rem .7rem; font-family:var(--font-body); font-size:.72rem; font-weight:500; font-style:normal; line-height:1.35; white-space:normal; width:max-content; max-width:150px; box-shadow:0 0 12px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:30;}
.sc-vocab-bubble::after{ content:''; position:absolute; top:100%; left:calc(50% - var(--shift,0px)); transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--coral); }
.sc-vocab-word.open .sc-vocab-bubble{ opacity:1; transform:translateX(calc(-50% + var(--shift,0px))) translateY(0) scale(1); pointer-events:auto; }
.sc-story-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:1rem; }
.sc-nav-btn{ font-family:var(--font-display); font-weight:600; border:none; border-radius:999px; padding:.65rem 1.3rem; font-size:.88rem; cursor:pointer; transition:transform .1s, box-shadow .15s; }
.sc-nav-btn:active{ transform:translateY(2px) scale(.98); }
.sc-nav-btn.primary{ background:linear-gradient(160deg,var(--gold),var(--gold-shadow)); color:#2A2118; box-shadow:0 0 16px rgba(244,201,93,.45); }
.sc-nav-btn.ghost{ background:transparent; color:var(--page-ink); opacity:.6; box-shadow:none; }
.sc-nav-btn:disabled{ opacity:.35; cursor:default; box-shadow:none; }

/* ---- Reflection quiz ---- */
.sc-reflect-q{ font-family:var(--font-story); font-style:italic; font-size:1.05rem; font-weight:500; color:var(--page-ink); max-width:440px; margin:0 auto .8rem; text-align:center; }
.sc-reflect-opts{ display:flex; flex-direction:column; gap:.6rem; max-width:420px; margin:0 auto; }
.sc-reflect-tile{ background:#fff; border:1.5px solid #D9CFB0; border-radius:14px; padding:.8rem 1rem; cursor:pointer; font-size:.92rem; text-align:left; transition:transform .1s, box-shadow .15s; color:var(--page-ink); }
.sc-reflect-tile:active{ transform:translateY(2px); }
.sc-reflect-tile.correct{ border-color:var(--sage-shadow); background:#E4F7F1; box-shadow:0 0 10px rgba(79,168,144,.3); }
.sc-reflect-tile.incorrect{ border-color:var(--coral-shadow); background:#FBEBEF; }
.sc-reflect-feedback{ max-width:420px; margin:.8rem auto 0; background:#EFE6D0; border-left:4px solid var(--gold-shadow); border-radius:10px; padding:.7rem .9rem; font-size:.88rem; color:var(--page-ink); opacity:0; max-height:0; overflow:hidden; transition:opacity .35s ease, max-height .35s ease, padding .35s ease; }
.sc-reflect-feedback.shown{ opacity:1; max-height:300px; padding:.7rem .9rem; }

/* ---- Badge award screen ---- */
.sc-award-stage{ text-align:center; padding:2rem 1rem; }
.sc-award-badge{ width:140px; height:140px; margin:0 auto 1rem; border-radius:50%; display:flex; align-items:center; justify-content:center; animation:scGlow 2s ease-in-out infinite; }
.sc-award-title{ font-family:var(--font-display); font-weight:600; font-size:1.4rem; color:var(--gold); text-shadow:0 0 16px rgba(244,201,93,.4); }
.sc-award-sub{ color:var(--ink-soft); max-width:400px; margin:.4rem auto 1.2rem; }
.sc-stars-row{ display:flex; justify-content:center; gap:.4rem; margin:.6rem 0 1.2rem; }

.sc-back-btn{ background:var(--card); border:1.5px solid var(--gold); color:var(--gold); border-radius:999px; padding:.5rem 1.1rem; font-family:var(--font-display); font-weight:600; font-size:.82rem; cursor:pointer; box-shadow:0 0 10px rgba(244,201,93,.2); }
</style>
</head>
<body>
<div class="viewport">

  <!-- ============ HUB / LIBRARY SCREEN ============ -->
  <section class="screen active" data-screen="hub">
    <div class="sc-header">
      <h1>Story Corner</h1>
      <p>A little story every day, about the big things: courage, kindness, patience, and being you.</p>
    </div>
    <div class="sc-streak-card">
      <svg class="sc-streak-flame" width="40" height="40" viewBox="0 0 40 40"><path d="M20 4 C12 14 10 20 12 26 a8 8 0 0 0 16 0 c2 -6 0 -12 -8 -22 Z" fill="var(--coral)"/><path d="M20 16 C16 22 15 25 16 28 a4 4 0 0 0 8 0 c1 -3 0 -6 -4 -12 Z" fill="var(--gold)"/></svg>
      <div>
        <div class="sc-streak-text" id="scStreakText">0-day streak</div>
        <div class="sc-streak-sub" id="scStreakSub">Read a story today to start one!</div>
      </div>
      <div class="sc-stars-total">
        <div class="num" id="scStarsTotal">0</div>
        <div class="lbl">STARS</div>
      </div>
    </div>
    <div class="sc-volume-grid" id="scVolumeGrid"></div>
    <div id="scBadgeCase"></div>
  </section>

  <!-- ============ VOLUME DETAIL SCREEN ============ -->
  <section class="screen" data-screen="volume">
    <button class="sc-back-btn" onclick="scGoHub()">&#8592; All Volumes</button>
    <div id="scVolumeDetailHeader"></div>
    <div class="sc-shelf" id="scVolumeShelf" style="margin-top:.9rem;"></div>
  </section>

  <!-- ============ STORY READER SCREEN ============ -->
  <section class="screen" data-screen="reader">
    <button class="sc-back-btn" onclick="scGoVolume()">&#8592; Bookshelf</button>
    <div class="sc-story-card" style="margin-top:1rem;">
      <div class="sc-story-topbar">
        <div class="sc-story-badge-name" id="scReaderTitle"></div>

function scKeepInBounds(bubbleEl){
  bubbleEl.style.setProperty('--shift', '0px');
  requestAnimationFrame(()=>{
    const card = bubbleEl.closest('.sc-story-card') || document.body;
    const bubbleRect = bubbleEl.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    const margin = 10;
    let shift = 0;
    if(bubbleRect.left < cardRect.left + margin){
      shift = (cardRect.left + margin) - bubbleRect.left;
    } else if(bubbleRect.right > cardRect.right - margin){
      shift = (cardRect.right - margin) - bubbleRect.right;
    }
    if(shift !== 0) bubbleEl.style.setProperty('--shift', shift + 'px');
  });
}
function scPlayCharAction(wrapEl, name, actionClass){
  const artEl = wrapEl.querySelector('svg')?.parentElement;
  if(!artEl) return false;
  const svgEl = artEl.querySelector('svg');
  const size = (svgEl && svgEl.getAttribute('width')) || 100;
  const usesProfile = PROFILE_ACTIONS.includes(actionClass) && CHAR_ART_PROFILE[name];
  if(usesProfile){
    artEl.innerHTML = CHAR_ART_PROFILE[name](size);
  }
  artEl.classList.remove(actionClass);
  void artEl.offsetWidth;
  artEl.classList.add(actionClass);
  if(typeof playBlip === 'function') playBlip(600, 0.1);
  const duration = PROFILE_ACTION_DURATION[actionClass] || 1800;
  setTimeout(()=>{
    artEl.classList.remove(actionClass);
    if(usesProfile && CHAR_ART[name]){
      artEl.innerHTML = CHAR_ART[name](size);
    }
  }, duration);
  return true;
}
function scCharSpeak(wrapEl, name){
  if(!introducedChars.includes(name) && CHAR_INTROS[name]){
    introducedChars.push(name);
    scShowBubble(wrapEl, name, CHAR_INTROS[name], 'happy');
    return;
  }
  const tapActions = (currentStory && currentStory.tapActions && currentStory.tapActions[name]) || [];
  if(tapActions.length && Math.random() < 0.5){
    scPlayCharAction(wrapEl, name, tapActions[Math.floor(Math.random()*tapActions.length)]);
    return;
  }
  let quips = CHAR_QUIPS[name] || [];
  if(currentStory && currentStory.quips && currentStory.quips[name] && currentStory.quips[name].length){
    quips = currentStory.quips[name];
  }
  if(!quips.length) return;
  const picked = quips[Math.floor(Math.random()*quips.length)];
  const text = typeof picked === 'string' ? picked : picked.t;
  const expr = typeof picked === 'string' ? 'happy' : (picked.e || 'happy');
  scShowBubble(wrapEl, name, text, expr);
}
function scShowBubble(wrapEl, name, line, expr){
  document.querySelectorAll('.sc-bubble.show').forEach(b => b.classList.remove('show'));
  let bubble = wrapEl.querySelector('.sc-bubble');
  if(!bubble){
    bubble = document.createElement('div');
    bubble.className = 'sc-bubble';
    wrapEl.appendChild(bubble);
  }
  bubble.textContent = line;
  clearTimeout(scBubbleTimer);
  requestAnimationFrame(()=> bubble.classList.add('show'));
  scKeepInBounds(bubble);
  const artEl = wrapEl.querySelector('svg')?.parentElement;
  const isProfilePose = artEl && PROFILE_ACTIONS.some(a => artEl.classList.contains(a));
  let originalExpr = 'happy';
  if(currentStory && currentStory.pages && currentStory.pages[currentPage]){
    const pageChar = currentStory.pages[currentPage].chars.find(c=>c.name===name);
    if(pageChar && pageChar.expr) originalExpr = pageChar.expr;
  }
  if(artEl && expr && CHAR_ART[name] && !isProfilePose){
    const svgEl = artEl.querySelector('svg');
    const size = (svgEl && svgEl.getAttribute('width')) || 100;
    artEl.innerHTML = CHAR_ART[name](size, expr);
  }
  if(artEl){
    artEl.classList.remove('sc-pop');
    void artEl.offsetWidth;
    artEl.classList.add('sc-pop');
  }
  if(typeof playBlip === 'function') playBlip(650, 0.08);
  scBubbleTimer = setTimeout(()=>{
    bubble.classList.remove('show');
    if(artEl && expr && CHAR_ART[name] && !isProfilePose){
      const svgEl = artEl.querySelector('svg');
      const size = (svgEl && svgEl.getAttribute('width')) || 100;

    }

}
function renderChar(name, size, animClass, expr){
  const usesProfile = animClass && PROFILE_ACTIONS.includes(animClass) && CHAR_ART_PROFILE[name];

function playBlip(freq, dur){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||0.1));
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + (dur||0.1));
  }catch(e){}
}

// ================= PERSISTENCE =================
const SC_READ_KEY = 'storyCornerReadIds_v1';
const SC_STARS_KEY = 'storyCornerStars_v1';
const SC_STREAK_KEY = 'storyCornerStreak_v1'; // {count, lastDate}
function loadReadIds(){ try{ return JSON.parse(localStorage.getItem(SC_READ_KEY) || '[]'); }catch(e){ return []; } }
function saveReadIds(arr){ try{ localStorage.setItem(SC_READ_KEY, JSON.stringify(arr)); }catch(e){} }
function loadStars(){ try{ const v = parseInt(localStorage.getItem(SC_STARS_KEY)); return isNaN(v) ? 0 : v; }catch(e){ return 0; } }
function saveStars(n){ try{ localStorage.setItem(SC_STARS_KEY, String(n)); }catch(e){} }
function loadStreak(){ try{ return JSON.parse(localStorage.getItem(SC_STREAK_KEY) || 'null') || {count:0,lastDate:null}; }catch(e){ return {count:0,lastDate:null}; } }
function saveStreak(s){ try{ localStorage.setItem(SC_STREAK_KEY, JSON.stringify(s)); }catch(e){} }

let readIds = loadReadIds();
let totalStars = loadStars();
let streak = loadStreak();

function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function bumpStreakIfNewDay(){
  const today = todayStr();
  if(streak.lastDate === today) return; // already counted today
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
  if(streak.lastDate === yStr){
    streak.count += 1;
  } else {
    streak.count = 1;
  }
  streak.lastDate = today;
  saveStreak(streak);
}

  document.getElementById('scStreakText').textContent = `${streak.count}-day streak`;

    ? "Come back tomorrow to keep it going!"
    : "Read a story today to start one!";
  document.getElementById('scStarsTotal').textContent = totalStars;
}

function isBatchUnlocked(batchNum){
  if(batchNum <= 1) return true;
  const prevBatchStories = STORY_LIBRARY.filter(s=>s.batch === batchNum - 1);
  if(prevBatchStories.length === 0) return false;
  return prevBatchStories.every(s=>readIds.includes(s.id));
}
function getCategoryCompletedCount(theme){
  return STORY_LIBRARY.filter(s=>s.theme===theme && readIds.includes(s.id)).length;

function renderVolumeOverview(){
  const grid = document.getElementById('scVolumeGrid');
  let html = '';
  for(let vol=1; vol<=5; vol++){
    const written = STORY_LIBRARY.filter(s=>s.batch===vol);
    const planned = PLANNED_STORIES.filter(s=>s.batch===vol);
    const total = written.length + planned.length;
    if(total === 0) continue;
    const unlocked = isBatchUnlocked(vol);
    const readCount = written.filter(s=>readIds.includes(s.id)).length;
    const info = VOLUME_INFO[vol];
    const pct = total > 0 ? Math.round((readCount/total)*100) : 0;
    const iconsHTML = written.slice(0,6).map(s=>{
      const b = BADGE_ICONS[s.theme];
      const done = readIds.includes(s.id);
      return `<div class="sc-volume-mini-icon" style="background:rgba(255,255,255,${done?'.9':'.25'});"><svg width="13" height="13" viewBox="0 0 44 44">${b.icon.replace(/#fff/g,'rgba(0,0,0,.55)')}</svg></div>`;
    }).join('');
    if(unlocked){
      html += `<div class="sc-volume-card" style="background:${info.color};" onclick="scOpenVolume(${vol})">

          <div class="sc-volume-number">${vol}</div>
          <div class="sc-volume-info">

          <div class="sc-volume-progress-track"><div class="sc-volume-progress-fill" style="width:${pct}%;"></div></div>
          <div class="sc-volume-progress-text">${readCount}/${total}</div>

        <div class="sc-volume-icons-row">${iconsHTML}</div>

    } else {
      html += `<div class="sc-volume-card locked" style="background:${info.color};">

    }
  }
  grid.innerHTML = html;

          <div class="sc-book-theme">${BADGE_NAMES[s.theme]}</div>
        </div>
        ${read ? `<div class="sc-book-check"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="var(--sage)"/><path d="M6 11 l3.5 3.5 L16 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : ''}
      </div>`;
    } else {
      html += `<div class="sc-book locked">
        <div class="sc-book-badge" style="background:${b.color};"><svg width="30" height="30" viewBox="0 0 44 44">${b.icon}</svg></div>
        <div>
          <div class="sc-book-title">${s.title}</div>
          <div class="sc-book-theme">${BADGE_NAMES[s.theme]}</div>
        </div>
        <div class="sc-lock-icon"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" rx="1.5" fill="none" stroke="var(--ink-soft)" stroke-width="1.8"/><path d="M6.5 9 V6 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="var(--ink-soft)" stroke-width="1.8"/></svg></div>
      </div>`;
    }
  });
  planned.forEach(s=>{
    const b = BADGE_ICONS[s.theme];
    html += `<div class="sc-book planned">
      <div class="sc-book-badge" style="background:${b.color};"><svg width="30" height="30" viewBox="0 0 44 44">${b.icon}</svg></div>
      <div>
        <div class="sc-book-title">${s.title}</div>
        <div class="sc-book-theme">Coming soon</div>
      </div>
    </div>`;
  });
  document.getElementById('scVolumeShelf').innerHTML = html;
}
function renderBadgeCase(){
  const card = document.getElementById('scBadgeCase');
  const categories = Object.keys(BADGE_NAMES);
  const slotsHTML = categories.map(theme=>{
    const b = BADGE_ICONS[theme];
    const tier = getCategoryCompletedCount(theme);
    const maxTier = Math.max(STORY_LIBRARY.filter(s=>s.theme===theme).length, 1);
    const earned = tier > 0;
    const tierLabel = earned ? TIER_NAMES[Math.min(tier,3)] : '';
    const dotsHTML = Array.from({length:maxTier}).map((_,i)=>
      `<span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:${i<tier?b.color:'#4A4A80'}; margin:0 1px;"></span>`
    ).join('');
    return `<div class="sc-badge-slot ${earned?'earned':''}">
      <div class="sc-badge-icon-wrap" style="background:${earned?b.color:'#4A4A80'};"><svg width="26" height="26" viewBox="0 0 44 44">${b.icon}</svg></div>
      <div class="sc-badge-label">${BADGE_NAMES[theme].replace(' Badge','')}</div>
      <div style="font-size:.6rem; color:${earned?b.color:'var(--ink-soft)'}; font-weight:700; min-height:.9rem;">${tierLabel}</div>
      <div>${dotsHTML}</div>
    </div>`;
  }).join('');
  const totalEarned = categories.filter(theme=>getCategoryCompletedCount(theme)>0).length;
  card.innerHTML = `<div class="sc-badge-case"><div class="sc-badge-case-title">My Badges (${totalEarned}/${categories.length}) \u2014 ${readIds.length} stories read</div><div class="sc-badge-grid">${slotsHTML}</div></div>`;
}
function scRenderHub(){
  renderStreakCard();
  renderVolumeOverview();
  renderBadgeCase();
}
function scShowScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelector(`.screen[data-screen="${name}"]`).classList.add('active');
  window.scrollTo(0,0);
}
function scGoHub(){
  scRenderHub();
  scShowScreen('hub');
}
let currentVolume = null;
function scOpenVolume(volumeNum){
  currentVolume = volumeNum;
  renderVolumeDetail(volumeNum);
  scShowScreen('volume');
}
function scGoVolume(){
  if(currentVolume){
    renderVolumeDetail(currentVolume);
    scShowScreen('volume');
  } else {
    scGoHub();
  }
}

// ================= STORY READER =================
let currentStory = null;
let currentPage = 0;
function scOpenStory(id){
  currentStory = STORY_LIBRARY.find(s=>s.id===id);
  if(!currentStory) return;
  currentVolume = currentStory.batch;
  currentPage = 0;
  introducedChars = [];
  document.getElementById('scReaderTitle').textContent = currentStory.title;
  scRenderPage();
  scShowScreen('reader');
}
function scParseVocab(text){
  return text.replace(/\{\{([^|]+)\|\|([^}]+)\}\}/g, (match, word, def) => {
    return `<span class="sc-vocab-word" onclick="scToggleVocab(event,this)">${word}<span class="sc-vocab-bubble">${def}</span></span>`;
  });
}
function scToggleVocab(event, el){
  event.stopPropagation();
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.sc-vocab-word.open').forEach(w => { if(w!==el) w.classList.remove('open'); });
  el.classList.toggle('open', !wasOpen);
  if(!wasOpen){
    if(typeof playBlip === 'function') playBlip(550, 0.06);
    const bubble = el.querySelector('.sc-vocab-bubble');
    if(bubble) scKeepInBounds(bubble);
  }
}
function scRenderPage(){
  const page = currentStory.pages[currentPage];
  const dotsHTML = currentStory.pages.map((_,i)=>`<div class="sc-page-dot ${i===currentPage?'on':''}"></div>`).join('');
  document.getElementById('scPageDots').innerHTML = dotsHTML;
  const charsHTML = page.chars.map(c=>renderChar(c.name, 100, c.anim, c.expr)).join('');
  const stage = document.getElementById('scStoryStage');
  stage.innerHTML = `<div class="sc-char-stage">${charsHTML}</div><div class="sc-story-text sc-fade">${scParseVocab(page.text)}</div>`;
  document.getElementById('scPrevPageBtn').disabled = currentPage === 0;
  document.getElementById('scNextPageBtn').textContent = currentPage === currentStory.pages.length - 1 ? 'Continue' : 'Next';
  page.chars.forEach(c=>{
    if(c.anim && PROFILE_ACTIONS.includes(c.anim) && CHAR_ART_PROFILE[c.name]){
      const wrap = stage.querySelector(`.sc-char-wrap[data-char="${c.name}"]`);
      if(!wrap) return;
      const artEl = wrap.querySelector('svg')?.parentElement;
      if(!artEl) return;
      const duration = PROFILE_ACTION_DURATION[c.anim] || 1000;
      setTimeout(()=>{
        artEl.classList.remove(c.anim);
        if(CHAR_ART[c.name]) artEl.innerHTML = CHAR_ART[c.name](100, c.expr);
      }, duration);
    }
  });
}
function scNextPage(){
  if(currentPage < currentStory.pages.length - 1){
    currentPage++;
    scRenderPage();
  } else {
    scStartReflection();
  }
}
function scPrevPage(){
  if(currentPage > 0){
    currentPage--;
    scRenderPage();
  }
}

// ================= REFLECTION =================
let reflectAnswered = false;
let reflectWasCorrect = false;
function scStartReflection(){
  reflectAnswered = false;
  reflectWasCorrect = false;
  const r = currentStory.reflection;
  document.getElementById('scReflectQ').textContent = r.question;
  document.getElementById('scReflectOpts').innerHTML = r.options.map((o,i)=>
    `<div class="sc-reflect-tile" id="scReflectOpt-${i}" onclick="scAnswerReflect(${i})">${o.text}</div>`
  ).join('');
  const fb = document.getElementById('scReflectFeedback');
  fb.classList.remove('shown');
  const nextBtn = document.getElementById('scReflectNextBtn');
  nextBtn.disabled = true;
  nextBtn.textContent = 'Continue';
  scShowScreen('reflect');
}
function scAnswerReflect(i){
  if(reflectAnswered) return;
  reflectAnswered = true;
  const r = currentStory.reflection;
  const correct = r.options[i].correct;
  reflectWasCorrect = correct;
  document.getElementById(`scReflectOpt-${i}`).classList.add(correct ? 'correct' : 'incorrect');
  if(!correct){
    const correctIdx = r.options.findIndex(o=>o.correct);
    document.getElementById(`scReflectOpt-${correctIdx}`).classList.add('correct');
  }
  const fb = document.getElementById('scReflectFeedback');
  fb.textContent = r.explain;
  fb.classList.add('shown');
  const nextBtn = document.getElementById('scReflectNextBtn');
  nextBtn.disabled = false;
  nextBtn.textContent = correct ? 'Continue' : 'Read the Story Again';
}
function scAfterReflect(){
  if(reflectWasCorrect){
    scAwardBadge();
  } else {
    currentPage = 0;
    scRenderPage();
    scShowScreen('reader');
  }
}

// ================= BADGE AWARD =================
function scAwardBadge(){
  const isNew = !readIds.includes(currentStory.id);
  if(isNew){
    readIds.push(currentStory.id);
    saveReadIds(readIds);
    totalStars += 3;
    saveStars(totalStars);
    bumpStreakIfNewDay();
  }
  const b = BADGE_ICONS[currentStory.theme];
  document.getElementById('scAwardBadgeIcon').style.background = b.color;
  document.getElementById('scAwardBadgeIcon').innerHTML = `<svg width="70" height="70" viewBox="0 0 44 44">${b.icon}</svg>`;
  document.getElementById('scAwardBadgeName').textContent = `${currentStory.badgeName} \u2014 for reading "${currentStory.title}"`;
  document.getElementById('scAwardStars').innerHTML = isNew
    ? `<svg width="28" height="28" viewBox="0 0 24 24" class="sc-star-pop"><path d="M12 2 l2.9 6.6 7.1.6 -5.4 4.7 1.6 7 -6.2 -3.8 -6.2 3.8 1.6 -7 -5.4 -4.7 7.1 -.6 Z" fill="var(--gold)"/></svg>`.repeat(3)
    : `<div style="font-size:.85rem; color:var(--ink-soft);">Already earned \u2014 great to revisit!</div>`;
  scShowScreen('award');
}

scRenderHub();

</script>
</body>
