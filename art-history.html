<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EEF7DC">
<title>Melissa's Art Through Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Design system: Art-game-melissa (tokens + components) */
:root{
  --paper:#FFFFFF; --ink:#152447; --ink-muted:#5E6880; --ink-shadow:rgba(21,36,71,.12); --backdrop:rgba(21,36,71,.55);
  --sky-50:#E3F4FE; --sky-400:#36ACF8; --sky-600:#168AD8; --sky-800:#0E64A6;
  --grass-400:#6CCB2C; --grass-600:#3B9512; --grass-800:#2A6E0B; --lime-300:#B5E83A; --lime-50:#EEF7DC;
  --sun-400:#FFD21F; --sun-600:#E0A800; --ember-700:#B83A0B; --butter-50:#FFF4C7; --tangerine-400:#FFB238;
  --grape-500:#7A4BE0; --grape-700:#5530B0; --berry-500:#D63F8C; --berry-700:#A82A6A; --bubblegum-300:#F57EBF; --blush-50:#FDEBF7;
  --tomato-500:#D93A3F; --wood-600:#B5651D; --floor-100:#FCEFE3; --floor-200:#F6E2CF; --cloud-100:#F1F3F6; --cloud-300:#D7DCE4; --slate-400:#8C95A8;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:Nunito,"Avenir Next","Trebuchet MS",sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-xl:44px; --radius-pill:999px;
  --shadow-card:0 10px 30px rgba(21,36,71,.10);
  --tap-min:56px; --tool-size:72px; --tile-width:120px;
  --bar-h:76px; --era:#36ACF8; --era-tint:#E3F4FE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--lime-50);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit}
svg{display:block}
.ic{width:100%;height:100%}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- buttons (Button, RoundButton) ---------- */
.ag-btn{--fill:var(--sky-600);--edge:var(--sky-800);--label:var(--paper);appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:60px;min-width:150px;padding:0 var(--space-5);margin-bottom:6px;border-radius:var(--radius-md);font:800 22px/1 var(--font-body);color:var(--label);background:var(--fill);box-shadow:0 0 0 3px var(--paper),0 6px 0 3px var(--edge);transition:transform 80ms ease,box-shadow 80ms ease}
.ag-btn .ic{width:28px;height:28px;flex:none}
.ag-btn:active{transform:translateY(5px);box-shadow:0 0 0 3px var(--paper),0 1px 0 3px var(--edge)}
.ag-btn:focus-visible,.ag-round:focus-visible,.focusable:focus-visible{outline:4px solid var(--ink);outline-offset:6px}
.ag-btn--grass{--fill:var(--grass-600);--edge:var(--grass-800)}
.ag-btn--sun{--fill:var(--sun-400);--edge:var(--sun-600);--label:var(--ember-700)}
.ag-btn--grape{--fill:var(--grape-500);--edge:var(--grape-700)}
.ag-btn--berry{--fill:var(--berry-500);--edge:var(--berry-700)}
.ag-btn--white{--fill:var(--paper);--edge:var(--cloud-300);--label:var(--ink)}
.ag-btn--block{width:100%}
.ag-btn--sm{min-height:52px;min-width:0;font-size:20px;padding:0 var(--space-4)}
.ag-btn:disabled{--fill:var(--cloud-100);--edge:var(--cloud-300);--label:var(--ink-muted);cursor:default;transform:none}
.ag-btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.ag-round{--fill:var(--grape-500);--edge:var(--grape-700);position:relative;appearance:none;border:0;padding:0;cursor:pointer;width:var(--tool-size);height:var(--tool-size);margin-bottom:6px;border-radius:50%;display:grid;place-items:center;background:var(--fill);box-shadow:0 0 0 4px var(--paper),0 6px 0 4px var(--edge);transition:transform 80ms ease,box-shadow 80ms ease;flex:none}
.ag-round .ic{width:58%;height:58%}
.ag-round:active{transform:translateY(5px);box-shadow:0 0 0 4px var(--paper),0 1px 0 4px var(--edge)}
.ag-round--nav{--fill:var(--paper);--edge:var(--cloud-300);width:var(--tap-min);height:var(--tap-min);box-shadow:0 4px 0 var(--edge)}
.ag-round--nav:active{box-shadow:0 1px 0 var(--edge)}
.ag-round--sky{--fill:var(--sky-600);--edge:var(--sky-800)}
.ag-round--grass{--fill:var(--grass-600);--edge:var(--grass-800)}
.ag-round--sun{--fill:var(--sun-400);--edge:var(--sun-600)}
.ag-round--berry{--fill:var(--berry-500);--edge:var(--berry-700)}
.ag-round.is-on{box-shadow:0 0 0 4px var(--ink),0 6px 0 4px var(--edge)}

/* ---------- status pieces ---------- */
.ag-counter{display:inline-flex;align-items:center;gap:var(--space-1);height:48px;padding:0 var(--space-4) 0 var(--space-2);border-radius:var(--radius-pill);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--cloud-300);font:700 24px/1 var(--font-display);font-variant-numeric:tabular-nums;flex:none}
.ag-counter .ic{width:32px;height:32px}
.ag-counter.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.18)}}
.ag-tag{display:inline-block;background:var(--paper);color:var(--ink);font:900 14px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:9px var(--space-4);border-radius:var(--radius-pill);box-shadow:0 4px 0 var(--cloud-300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ag-pill{display:inline-block;padding:9px 24px;border-radius:var(--radius-pill);background:var(--grass-600);color:var(--paper);font:800 20px/1 var(--font-body)}
.ag-logo{margin:0;font:800 clamp(40px,7vw,72px)/1 var(--font-display);color:var(--sky-600);-webkit-text-stroke:12px var(--paper);paint-order:stroke fill;filter:drop-shadow(0 5px 0 var(--ink-shadow));text-wrap:balance}

/* ---------- top bar ---------- */
.topbar{flex:none;height:var(--bar-h);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4)}
.topbar .mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:var(--space-3)}
.topbar .right{display:flex;align-items:center;gap:var(--space-3)}
.steps{display:flex;gap:6px;align-items:center}
.steps i{display:block;width:14px;height:14px;border-radius:50%;background:var(--cloud-300);box-shadow:0 0 0 3px var(--paper)}
.steps i.done{background:var(--grass-600)}
.steps i.now{background:var(--sky-600);width:30px;border-radius:var(--radius-pill)}

/* ---------- title screen ---------- */
.title-screen{background:var(--lime-50);overflow:hidden}
.title-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:var(--space-5);padding:var(--space-5) var(--space-7)}
.title-copy{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-4)}
.title-copy p{margin:0;font:700 19px/28px var(--font-body);max-width:440px}
.title-btns{display:flex;flex-wrap:wrap;gap:var(--space-4);margin-top:var(--space-3)}
.title-art{position:relative;height:min(70vh,520px);display:grid;place-items:center}
.title-art .iris-big{width:min(46vh,340px);position:relative;z-index:2;animation:bob 3s ease-in-out infinite}
.title-art .frame{position:absolute;width:30%;aspect-ratio:4/3;border:7px solid var(--wood-600);border-radius:6px;background:var(--paper);box-shadow:0 8px 0 var(--ink-shadow);overflow:hidden}
.title-art .frame svg{width:100%;height:100%}
.title-blob{position:absolute;border-radius:50%;opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hello{font:900 14px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--grape-500)}

/* ---------- timeline map ---------- */
.map-screen{background:linear-gradient(var(--sky-50),var(--lime-50))}
.tl-wrap{flex:1;min-height:0;position:relative}
.tl-track{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tl-track::-webkit-scrollbar{display:none}
.tl-lane{position:relative;height:100%;min-height:360px;display:flex;align-items:stretch;padding:0 40vw 0 var(--space-6)}
.tl-road{position:absolute;left:0;right:0;top:calc(50% - 9px);height:18px;background:repeating-linear-gradient(90deg,var(--wood-600) 0 28px,#C97A30 28px 56px);border-radius:9px;box-shadow:0 4px 0 #8A4A14}
.station{position:relative;flex:none;width:calc(min(208px,26vh) + 26px);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center}
.station .card{position:absolute;left:50%;transform:translateX(-50%);width:min(208px,26vh);background:var(--paper);border-radius:var(--radius-lg);padding:var(--space-3);box-shadow:0 5px 0 var(--cloud-300);border:0;cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.station:nth-child(odd) .card{bottom:calc(50% + 62px)}
.station:nth-child(even) .card{top:calc(50% + 40px)}
.station .card:active{transform:translateX(-50%) translateY(3px)}
.station .thumb{width:100%;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:var(--cloud-100);position:relative}
.station .thumb svg{width:100%;height:100%}
.station .thumb .lockcover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(241,243,246,.86)}
.station .thumb .lockcover .ic{width:52px;height:52px}
.station .when{font:900 12px/16px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.station .name{font:800 17px/21px var(--font-body)}
.station .stars{display:flex;gap:2px;height:22px}
.station .stars .ic{width:22px;height:22px}
.station .node{position:absolute;top:calc(50% - 23px);left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 5px var(--era),0 5px 0 5px rgba(21,36,71,.15);display:grid;place-items:center;font:800 18px/1 var(--font-display);color:var(--ink);z-index:2}
.station.locked .node{box-shadow:0 0 0 5px var(--cloud-300)}
.station.locked .card{opacity:.92}
.station.is-current .card{box-shadow:0 0 0 4px var(--sun-400),0 6px 0 4px var(--sun-600)}
.station .stick{position:absolute;left:50%;width:4px;background:var(--cloud-300);transform:translateX(-50%)}
.station:nth-child(odd) .stick{bottom:50%;height:62px}
.station:nth-child(even) .stick{top:50%;height:40px}
.tl-iris{position:absolute;top:calc(50% - 62px);width:86px;z-index:3;transition:left .6s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tl-bottom{flex:none;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-5) var(--space-4)}
.machine{flex:1;min-width:0;background:var(--paper);border-radius:var(--radius-pill);box-shadow:0 4px 0 var(--cloud-300);padding:var(--space-2) var(--space-5);display:flex;align-items:center;gap:var(--space-4)}
.machine label{font:900 14px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--grape-500);white-space:nowrap}
.machine output{font:700 20px/1 var(--font-display);min-width:150px;text-align:right;white-space:nowrap}
input[type=range].tm{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:linear-gradient(90deg,#C8742F,#21A89A,#4E8FD1,#7A4BE0,#3B9512,#8E5A2B,#2C5BA8,#E07AB8,#2E4FA8,#E8590C,#7C6A55,#D93A3F,#8B5CF6,#5E6880,#E0559F,#FFB238);outline:none}
input[type=range].tm::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--paper);border:6px solid var(--sky-600);box-shadow:0 3px 0 var(--sky-800);cursor:pointer}
input[type=range].tm::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--paper);border:6px solid var(--sky-600);cursor:pointer}
.map-actions{display:flex;gap:var(--space-4)}
.big-tool{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;font:800 13px/1.1 var(--font-body);color:var(--ink);padding:0}
.big-tool .ag-round{pointer-events:none}

/* ---------- era screen ---------- */
.era-screen{background:var(--era-tint)}
.era-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;gap:var(--space-3) var(--space-5);padding:0 var(--space-5) var(--space-4)}
.era-body .era-scroll > .stage{grid-row:1 / 3;grid-column:1}
.era-body .era-scroll > .side{grid-row:1;grid-column:2}
.era-body > .nav-row{grid-row:2;grid-column:2;position:static;padding-top:0;background:none}
.stage{position:relative;min-height:0;min-width:0;container-type:size;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:min(100cqw,calc(100cqh * 4 / 3));aspect-ratio:4/3;background:var(--paper);border:6px solid var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;touch-action:none}
.board > svg,.board > canvas,.board > .layer{position:absolute;inset:0;width:100%;height:100%}
.board canvas{touch-action:none}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-2) 2px 6px}
.talk{display:flex;align-items:flex-end;gap:var(--space-2)}
.talk .iris-mini{width:130px;flex:none;cursor:pointer}
.ag-bubble{position:relative;flex:1;min-width:0;background:var(--paper);color:var(--ink);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-4) var(--space-4) var(--space-5);font:700 19px/28px var(--font-body);box-shadow:0 4px 0 var(--cloud-300);margin-bottom:24px}
.ag-bubble::after{content:"";position:absolute;left:-8px;bottom:22px;width:24px;height:24px;background:var(--paper);transform:rotate(45deg);border-radius:4px}
.ag-bubble__name{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-1);font:900 14px/18px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--grape-500)}
.bubble-text{position:relative;z-index:1}
.pager{display:flex;gap:6px;margin-top:var(--space-3)}
.pager i{width:10px;height:10px;border-radius:50%;background:var(--cloud-300)}
.pager i.on{background:var(--grape-500)}
.nav-row{display:flex;gap:var(--space-3);margin-top:auto;padding:var(--space-3) 0 2px;position:sticky;bottom:0;z-index:3;background:var(--lime-50)}
.era-screen .nav-row{background:var(--era-tint)}
.nav-row .ag-btn{flex:1;min-width:0}
.mission{background:var(--paper);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);box-shadow:0 4px 0 var(--cloud-300);display:flex;flex-direction:column;gap:var(--space-2)}
.mission .goal{font:800 17px/22px var(--font-body);display:flex;justify-content:space-between;gap:var(--space-2)}
.mission .goal b{font:700 20px/1 var(--font-display);color:var(--grape-500);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;border-radius:7px;background:var(--cloud-100);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grass-400),var(--grass-600));border-radius:7px;transition:width .3s}
.tools{display:flex;flex-direction:column;gap:var(--space-3)}
.tool-row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.tool-label{font:900 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.chip{appearance:none;border:0;cursor:pointer;min-height:48px;padding:0 var(--space-3);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:800 16px/1 var(--font-body);box-shadow:0 4px 0 var(--cloud-300);display:inline-flex;align-items:center;gap:6px;transition:transform 80ms}
.chip .ic{width:26px;height:26px}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cloud-300)}
.chip[aria-pressed="true"]{background:var(--sky-50);box-shadow:0 0 0 3px var(--sky-600),0 4px 0 3px var(--sky-800)}
.chip:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ag-paints{display:flex;flex-wrap:wrap;gap:10px;padding:var(--space-3);background:var(--paper);border-radius:var(--radius-md);box-shadow:0 4px 0 var(--cloud-300)}
.ag-paint{appearance:none;cursor:pointer;padding:0;width:48px;height:48px;border-radius:50%;border:4px solid var(--paper);background:var(--c);box-shadow:0 0 0 2px var(--cloud-300);transition:transform 120ms ease;position:relative}
.ag-paint[aria-pressed="true"]{transform:scale(1.14);box-shadow:0 0 0 4px var(--ink)}
.ag-paint .num{position:absolute;inset:0;display:grid;place-items:center;font:900 16px/1 var(--font-body);color:var(--paper);text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* story postcard */
.postcard{position:absolute;inset:0;display:flex;flex-direction:column;padding:4% 5%;gap:3%;background:var(--era-tint)}
.postcard h2{margin:0;font:800 clamp(28px,5.2cqw,50px)/1.05 var(--font-display);color:var(--ink)}
.postcard .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.fact{background:var(--paper);border-radius:var(--radius-md);padding:var(--space-3);box-shadow:0 4px 0 var(--cloud-300);min-width:0}
.fact b{display:block;font:900 12px/16px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
.fact span{font:800 clamp(14px,2.1cqw,18px)/1.25 var(--font-body)}
.postcard .pc-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4%}
.postcard .peek-cap{font:800 18px/1.2 var(--font-body);color:var(--ink);max-width:160px}
.postcard .peek{position:relative;height:100%;max-height:100%;aspect-ratio:4/3;max-width:100%;border:8px solid var(--wood-600);border-radius:8px;background:#2a2a2a;overflow:hidden;justify-self:center;box-shadow:0 8px 0 var(--ink-shadow)}
.postcard .peek svg{width:100%;height:100%;filter:blur(14px) saturate(1.2);transform:scale(1.15)}
.postcard .peek .q{position:absolute;inset:0;display:grid;place-items:center;font:800 64px/1 var(--font-display);color:var(--paper);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.postcard .pc-iris{height:100%;max-height:260px;justify-self:center}
.mini-tl{display:flex;align-items:center;gap:0;position:relative;padding:6px 0}
.mini-tl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--cloud-300);border-radius:3px}
.mini-tl i{position:relative;flex:1;display:grid;place-items:center}
.mini-tl i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--cloud-300)}
.mini-tl i.past::after{box-shadow:0 0 0 3px var(--grass-600);background:var(--grass-400)}
.mini-tl i.here::after{width:24px;height:24px;background:var(--era);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink)}
.mini-tl-labels{display:flex;justify-content:space-between;font:800 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--slate-400);margin-top:6px}
/* journey line: a slim track that fills up to the current stop, fine ticks, one pin */
.journey{position:relative;padding:40px 10px 8px}
.jr-track{position:relative;height:4px;border-radius:2px;background:rgba(21,36,71,.12)}
.jr-fill{position:absolute;left:0;top:0;bottom:0;width:var(--p);border-radius:2px;background:linear-gradient(90deg,var(--wood-600),var(--era))}
.jr-track i{position:absolute;top:50%;width:1.5px;height:8px;margin:-4px 0 0 -.75px;border-radius:1px;background:rgba(21,36,71,.14)}
.jr-track i.past{display:none}
.jr-pin{position:absolute;left:var(--p);top:50%;width:0;height:0}
.jr-pin b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--era);box-shadow:0 0 0 3px var(--paper),0 2px 6px 3px rgba(21,36,71,.18)}
.jr-flag{position:absolute;bottom:14px;left:0;transform:translateX(calc(-1 * var(--p)));white-space:nowrap;background:var(--ink);color:var(--paper);font:800 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
.jr-flag::after{content:"";position:absolute;left:clamp(10px,var(--p),calc(100% - 10px));bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--ink);transform:rotate(45deg);border-radius:1px}

/* scratch + reveal */
.scratch-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;font:800 26px/1 var(--font-display);color:var(--paper);text-shadow:0 3px 0 rgba(0,0,0,.25);transition:opacity .3s}
.scratch-hint .hand{width:72px;height:72px;animation:rub 1.2s ease-in-out infinite}
@keyframes rub{0%,100%{transform:translate(-18px,0) rotate(-10deg)}50%{transform:translate(18px,6px) rotate(10deg)}}
.plaque{position:absolute;left:4%;right:4%;bottom:4%;background:var(--paper);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-card);display:grid;grid-template-columns:1fr auto;gap:2px var(--space-3);animation:rise .45s cubic-bezier(.3,1.4,.5,1)}
.plaque h3{margin:0;font:800 clamp(18px,3cqw,26px)/1.15 var(--font-body);grid-column:1/-1}
.plaque p{margin:0;font:700 15px/20px var(--font-body);color:var(--ink-muted)}
.plaque .where{grid-column:1/-1;display:flex;align-items:center;gap:6px;font:800 15px/20px var(--font-body);color:var(--ink)}
.plaque .where .ic{width:22px;height:22px;flex:none}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.zoombtn{position:absolute;right:3%;top:3%}

/* artists */
.artists{position:absolute;inset:0;padding:4%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3%;align-content:center;background:var(--era-tint);overflow:auto}
.artist{background:var(--paper);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);box-shadow:0 4px 0 var(--cloud-300);border:0;text-align:left;cursor:pointer;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:transform .15s;min-width:0}
.artist:active{transform:scale(.98)}
.artist .who{display:flex;align-items:center;gap:var(--space-3)}
.artist .face{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 20px/1 var(--font-display);color:var(--paper)}
.artist h4{margin:0;font:800 clamp(16px,2.4cqw,20px)/1.15 var(--font-body)}
.artist .w{font:700 15px/20px var(--font-body);color:var(--ink-muted)}
.artist .f{font:700 16px/22px var(--font-body);display:none}
.artist.open .f{display:block}
.artist.open{box-shadow:0 0 0 3px var(--grape-500),0 4px 0 3px var(--grape-700)}
.artist.seen .face::after{content:"";}

/* quiz */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:4%;padding:5%;background:var(--era-tint)}
.quiz h3{margin:0;font:900 clamp(22px,4cqw,34px)/1.15 var(--font-body);text-wrap:balance}
.quiz .qn{font:900 14px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.answers{display:flex;flex-direction:column;gap:var(--space-4)}
.answer{justify-content:flex-start;text-align:left;font-size:clamp(18px,2.8cqw,22px);line-height:1.2;padding:var(--space-3) var(--space-5);min-height:64px}
.answer.right{--fill:var(--grass-600);--edge:var(--grass-800);--label:var(--paper)}
.answer.wrong{--fill:var(--cloud-100);--edge:var(--cloud-300);--label:var(--ink-muted);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* modal + reward */
.modal{position:fixed;inset:0;background:var(--backdrop);display:grid;place-items:center;padding:var(--space-4);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ag-dialog{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);color:var(--ink);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.ag-dialog__head{position:relative;background:var(--cloud-100);padding:var(--space-4) 64px;text-align:center;font:800 24px/1.2 var(--font-body)}
.ag-dialog__close{position:absolute;right:var(--space-3);top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;padding:0;background:none;cursor:pointer}
.ag-dialog__body{padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);align-items:center;text-align:center}
.ag-dialog__body p{margin:0;font:700 19px/28px var(--font-body)}
.reward-stars{display:flex;gap:var(--space-3)}
.reward-stars .ic{width:72px;height:72px}
.reward-stars .ic.pop{animation:starpop .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.reward-row{display:flex;gap:var(--space-4);align-items:center;justify-content:center;flex-wrap:wrap}
.sticker{width:150px;aspect-ratio:4/3;border-radius:var(--radius-sm);overflow:hidden;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--cloud-300),0 6px 0 3px var(--cloud-300);transform:rotate(-4deg)}
.sticker svg,.sticker img{width:100%;height:100%;display:block;object-fit:cover}
.big-num{font:800 40px/1 var(--font-display)}
.dlg-btns{display:flex;flex-wrap:wrap;gap:var(--space-4);justify-content:center;width:100%}
.dlg-btns .ag-btn{flex:1}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:800 18px/1.3 var(--font-body);padding:var(--space-3) var(--space-5);border-radius:var(--radius-pill);z-index:70;animation:rise .3s;max-width:90vw;text-align:center}

/* arcade, museum, closet, studio */
.page{flex:1;min-height:0;overflow:auto;padding:var(--space-2) var(--space-6) var(--space-6)}
.page h2{font:800 40px/1.05 var(--font-display);margin:var(--space-2) 0 var(--space-4)}
.page .lead{font:700 19px/28px var(--font-body);margin:0 0 var(--space-5);max-width:640px}
.arcade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--space-5)}
.game-card{appearance:none;border:0;cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--ink);background:var(--paper);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:0 5px 0 var(--cloud-300);display:flex;flex-direction:column;gap:var(--space-2);transition:transform .15s}
.game-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cloud-300)}
.game-card .gi{width:84px;height:84px;border-radius:var(--radius-md);display:grid;place-items:center;padding:14px}
.game-card h3{margin:var(--space-2) 0 0;font:800 24px/1.1 var(--font-body)}
.game-card p{margin:0;font:700 16px/22px var(--font-body);color:var(--ink-muted)}
.mem-grid{display:grid;gap:var(--space-3);margin:0 auto;max-width:900px}
.mem-card{appearance:none;border:0;padding:0;cursor:pointer;aspect-ratio:4/3;perspective:600px;background:none}
.mem-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mem-card.flip .mem-inner,.mem-card.match .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;border-radius:var(--radius-md);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:grid;place-items:center;box-shadow:0 4px 0 var(--cloud-300)}
.mem-back{background:var(--grape-500);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25) 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.2) 0 8%,transparent 9%)}
.mem-back .ic{width:44%;height:44%}
.mem-front{background:var(--paper);transform:rotateY(180deg)}
.mem-front svg{width:100%;height:100%}
.mem-front .txt{padding:var(--space-2);font:800 clamp(14px,1.8vw,18px)/1.2 var(--font-body);text-align:center}
.mem-front .txt small{display:block;font:700 13px/1.2 var(--font-body);color:var(--ink-muted);margin-top:4px}
.mem-card.match .mem-front{box-shadow:0 0 0 4px var(--grass-600)}
.game-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);justify-content:space-between;margin-bottom:var(--space-4)}
.game-head h2{margin:0}
.pz-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-5);align-items:start}
.pz-board{display:grid;gap:3px;background:var(--wood-600);padding:6px;border-radius:var(--radius-md);aspect-ratio:4/3;width:100%;max-height:calc(100dvh - 210px);max-width:calc((100dvh - 210px) * 4 / 3);margin:0 auto;touch-action:none}
.pz-tile{border:0;padding:0;cursor:pointer;background-repeat:no-repeat;border-radius:4px;transition:transform .15s,box-shadow .15s}
.pz-tile.sel{transform:scale(.92);box-shadow:0 0 0 4px var(--sun-400)}
.pz-tile.ok{cursor:default}
.pz-side{display:flex;flex-direction:column;gap:var(--space-4)}
.pz-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.pz-pick button{border:0;padding:0;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:4/3;cursor:pointer;box-shadow:0 3px 0 var(--cloud-300)}
.pz-pick button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sky-600)}
.pz-pick svg{width:100%;height:100%}
.order-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3);position:relative;padding-bottom:34px}
.order-slots::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--wood-600),var(--sun-400))}
.slot{aspect-ratio:4/3;border-radius:var(--radius-md);border:4px dashed var(--cloud-300);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;overflow:hidden}
.slot .n{font:800 30px/1 var(--font-display);color:var(--cloud-300)}
.slot .n:has(+ svg){position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-size:16px;box-shadow:0 2px 0 var(--cloud-300);z-index:1}
.dir-v{display:none}
.slot svg{width:100%;height:100%}
.slot.ok{border:4px solid var(--grass-600)}
.slot.bad{border:4px solid var(--tomato-500);animation:shake .35s}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(21,36,71,.78);color:var(--paper);font:800 12px/1.2 var(--font-body);padding:4px}
.order-tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3);margin-top:var(--space-4)}
.order-card{border:0;padding:0;aspect-ratio:4/3;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;box-shadow:0 4px 0 var(--cloud-300);background:var(--paper)}
.order-card svg{width:100%;height:100%}
.order-card.sel{box-shadow:0 0 0 4px var(--sun-400),0 4px 0 4px var(--sun-600);transform:translateY(-4px)}
.order-card.used{visibility:hidden}
.order-labels{display:flex;justify-content:space-between;font:900 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-top:-22px;margin-bottom:var(--space-3)}
.museum-wall{background:var(--floor-100);border-radius:var(--radius-lg);padding:var(--space-5);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-5)}
.museum-item{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2);font-family:var(--font-body);color:var(--ink);text-align:center}
.museum-item .fr{border:9px solid var(--wood-600);border-radius:6px;background:var(--paper);aspect-ratio:4/3;overflow:hidden;box-shadow:0 6px 0 var(--ink-shadow)}
.museum-item:nth-child(3n+2) .fr{border-color:var(--grape-500)}
.museum-item:nth-child(3n) .fr{border-color:var(--sun-600)}
.museum-item img{width:100%;height:100%;object-fit:cover;display:block}
.museum-item b{font:800 16px/1.2 var(--font-body)}
.museum-item small{font:700 13px/1.2 var(--font-body);color:var(--ink-muted)}
.sticker-book{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-4)}
.sb-item{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font:800 14px/1.2 var(--font-body)}
.sb-item .sticker{width:100%;transform:rotate(var(--r,-3deg))}
.sb-item.locked .sticker{filter:grayscale(1) brightness(1.6) blur(3px);opacity:.6}
.empty{background:var(--paper);border-radius:var(--radius-lg);padding:var(--space-6);text-align:center;font:700 19px/28px var(--font-body);box-shadow:0 4px 0 var(--cloud-300)}
.section-title{font:900 14px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--grape-500);margin:var(--space-6) 0 var(--space-3)}
.closet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--space-5);flex:1;min-height:0;padding:0 var(--space-5) var(--space-4)}
.dressing{position:relative;border-radius:var(--radius-xl);overflow:hidden;border:6px solid var(--paper);box-shadow:var(--shadow-card);background:linear-gradient(#F3D27A 0 64%,transparent 64%),repeating-linear-gradient(90deg,#B5652D 0 40px,#A65A25 40px 80px);display:grid;place-items:end center;min-height:0}
.dressing::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:radial-gradient(circle at 20px -6px,#E5484D 28px,transparent 29px) 0 0/40px 46px repeat-x}
.dressing .iris-dress{width:min(78%,360px);margin-bottom:6%;position:relative;z-index:1}
.dressing .lamp{position:absolute;top:50px;width:40px;height:40px;border-radius:50%;background:#3A3A55;box-shadow:inset 0 -12px 0 #76E0FF}
.closet-side{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.ag-tabs{display:inline-flex;gap:var(--space-2);padding:var(--space-2);background:var(--paper);border-radius:var(--radius-md);box-shadow:0 4px 0 var(--cloud-300);align-self:flex-start}
.ag-tab{appearance:none;border:0;background:transparent;cursor:pointer;position:relative;min-width:68px;height:56px;border-radius:var(--radius-sm);display:grid;place-items:center;font:800 15px/1 var(--font-body);color:var(--ink-muted);padding:0 var(--space-3)}
.ag-tab[aria-selected="true"]{background:var(--sky-50);color:var(--ink)}
.ag-tab[aria-selected="true"]::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:24px;height:4px;border-radius:2px;background:var(--sky-600)}
.ag-tray{flex:1;min-height:0;overflow:auto;background:var(--floor-100);border-radius:var(--radius-lg);padding:var(--space-4);display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-width),1fr));gap:var(--space-3);align-content:start}
.ag-tile{appearance:none;cursor:pointer;min-height:156px;border-radius:var(--radius-md);background:var(--paper);border:3px solid var(--floor-200);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:var(--space-2);padding:var(--space-2) var(--space-2) var(--space-3);font-family:var(--font-body);color:var(--ink)}
.ag-tile .prev{width:84px;height:84px}
.ag-tile .nm{font:800 14px/1.15 var(--font-body);text-align:center}
.ag-tile .ck{width:34px;height:34px}
.ag-tile.is-selected{border:4px solid var(--grass-600)}
.ag-price{display:inline-flex;align-items:center;gap:var(--space-1);height:36px;padding:0 var(--space-3) 0 4px;border-radius:var(--radius-pill);background:var(--sky-600);color:var(--paper);font:800 20px/1 var(--font-body);font-variant-numeric:tabular-nums}
.ag-price .ic{width:28px;height:28px;background:var(--paper);border-radius:50%;padding:2px}
.studio-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;gap:var(--space-3) var(--space-5);padding:0 var(--space-5) var(--space-4)}
.studio-wrap .era-scroll > .stage{grid-row:1 / 3;grid-column:1}
.studio-wrap .era-scroll > .side{grid-row:1;grid-column:2}
.studio-wrap > .nav-row{grid-row:2;grid-column:2;position:static;padding-top:0;background:none}
.cert{max-width:760px;margin:0 auto;background:var(--paper);border-radius:var(--radius-lg);border:10px solid var(--sun-400);box-shadow:0 0 0 6px var(--paper),0 10px 0 6px var(--sun-600);padding:var(--space-6);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.cert h2{margin:0}
.cert .who{font:800 52px/1 var(--font-display);color:var(--grape-500)}
.cert .row{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:center}
.cert .row .sticker{width:84px;border-width:3px;transform:rotate(0)}



/* ---------- period games, picture questions, studio helper ---------- */
.page-hero{display:flex;align-items:flex-end;gap:var(--space-3)}
.page-hero .hero-iris{width:96px;flex:none;margin-bottom:-6px}
.answers.pics{flex-direction:row;gap:var(--space-3)}
.answer-pic{flex:1;min-width:0;aspect-ratio:4/3;border:0;padding:0;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;box-shadow:0 0 0 3px var(--paper),0 6px 0 3px var(--cloud-300);transition:transform .15s}
.answer-pic svg{width:100%;height:100%}
.answer-pic.right{box-shadow:0 0 0 5px var(--grass-600),0 6px 0 5px var(--grass-800);transform:scale(1.04)}
.answer-pic.wrong{opacity:.35;animation:shake .35s}
.pg-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--space-5);padding:0 var(--space-5) var(--space-4)}
.pg-main{min-height:0;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)}
.pg-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.pg-score{display:flex;align-items:center;gap:6px;font:700 24px/1 var(--font-display)}
.pg-score .ic{width:30px;height:30px}
.pg-score .streak{margin-left:8px;background:var(--tangerine-400);color:var(--ink);font:900 13px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:var(--radius-pill);animation:pop .3s}
.pg-board{position:relative;flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:var(--space-3);overflow:auto}
.pg-art{width:min(100cqw,calc(100cqh * 4 / 3 - 40px));aspect-ratio:4/3;border:9px solid var(--wood-600);border-radius:8px;overflow:hidden;box-shadow:0 8px 0 var(--ink-shadow);background:var(--paper)}
.pg-art svg{width:100%;height:100%}
.pg-board .plaque{position:static;width:min(100%,520px)}
.pg-side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-2) 2px}
.pg-side .iris-mini{width:96px;flex:none}
.pg-answers{display:flex;flex-direction:column;gap:var(--space-3)}
.pg-opt{justify-content:flex-start;gap:var(--space-3);text-align:left;min-height:64px}
.pg-opt .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--cloud-300)}
.pg-opt b{display:block;font:800 19px/1.15 var(--font-body)}
.pg-opt small{display:block;font:700 13px/1.2 var(--font-body);opacity:.75;margin-top:2px}
.pg-level{align-self:flex-start}
.clues{display:flex;flex-direction:column;gap:var(--space-3);width:min(100%,560px)}
.clue{flex:none;background:var(--paper);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);box-shadow:0 4px 0 var(--cloud-300);font:800 19px/1.3 var(--font-body);color:var(--cloud-300);display:flex;gap:var(--space-3);align-items:center}
.clue.on{color:var(--ink);animation:rise .35s}
.clue .cn{font:900 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--grape-500);border-radius:var(--radius-pill);padding:6px 10px;flex:none}
.clue:not(.on) .cn{background:var(--cloud-300)}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.det-card{aspect-ratio:4/3;border:0;padding:0;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;box-shadow:0 0 0 3px var(--paper),0 5px 0 3px var(--cloud-300)}
.det-card svg{width:100%;height:100%}
.det-card.ok{box-shadow:0 0 0 5px var(--grass-600)}
.det-card.no{opacity:.3;animation:shake .35s}
.sort-title{font:800 20px/1.2 var(--font-body);text-align:center}

/* ---------- Iris, animated ---------- */
.iris .i-all{transform-box:fill-box;transform-origin:50% 100%;animation:i-breathe 3.2s ease-in-out infinite}
@keyframes i-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
.iris .i-eye{transform-box:fill-box;transform-origin:center;animation:i-blink 4.8s infinite;animation-delay:var(--bd,0s)}
@keyframes i-blink{0%,92%,97%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
.iris .i-tail{transform-box:fill-box;transform-origin:0% 70%;animation:i-wag 2.6s ease-in-out infinite}
@keyframes i-wag{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.iris .i-track{transition:transform .18s ease-out}
.iris .i-look,.iris .i-brows,.iris .i-head{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.iris .i-head{transform-box:fill-box;transform-origin:50% 90%}
.iris .i-arm{transform-box:view-box;transform-origin:146px 146px}
.iris .m-grin,.iris .m-wow,.iris .m-think,.iris .m-oops,.iris .m-talk,.iris .i-thought,.iris .i-sweat,.iris .i-spark{display:none}
.iris.mood-grin .m-happy,.iris.mood-cheer .m-happy,.iris.mood-wow .m-happy,.iris.mood-think .m-happy,.iris.mood-oops .m-happy,.iris.talking .m-happy{display:none}
.iris.mood-grin .m-grin,.iris.mood-cheer .m-grin{display:inline}
.iris.mood-wow .m-wow{display:inline}
.iris.mood-think .m-think,.iris.mood-think .i-thought{display:inline}
.iris.mood-oops .m-oops,.iris.mood-oops .i-sweat{display:inline}
.iris.talking:not(.mood-grin):not(.mood-cheer):not(.mood-wow):not(.mood-think):not(.mood-oops) .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:i-talk .22s ease-in-out infinite alternate}
@keyframes i-talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.iris.mood-wow .i-all{animation:i-hop .6s cubic-bezier(.3,1.6,.5,1)}
.iris.mood-wow .i-brows{transform:translateY(-6px)}
.iris.mood-wow .i-eye{animation:none;transform:scale(1.15)}
.iris.mood-cheer .i-all{animation:i-hop .55s cubic-bezier(.3,1.6,.5,1) 2}
.iris.mood-cheer .i-arm{animation:i-wave .3s ease-in-out infinite alternate}
.iris.mood-cheer .i-spark{display:inline;animation:i-twinkle .6s ease-in-out infinite alternate}
.iris.mood-cheer .i-eye,.iris.mood-grin .i-eye{animation:none;transform:scaleY(.55)}
.iris.mood-grin .i-all{animation:i-giggle .18s ease-in-out 4}
.iris.mood-think .i-head{transform:rotate(-7deg)}
.iris.mood-think .i-look{transform:translate(5px,-6px)}
.iris.mood-think .i-brows{transform:translateY(-3px)}
.iris.mood-think .i-thought{animation:i-twinkle 1s ease-in-out infinite alternate}
.iris.mood-oops .i-head{transform:rotate(5deg)}
.iris.mood-oops .b-l{transform-box:fill-box;transform-origin:center;transform:rotate(12deg) translateY(2px)}
.iris.mood-oops .b-r{transform-box:fill-box;transform-origin:center;transform:rotate(-12deg) translateY(2px)}
@keyframes i-hop{40%{transform:translateY(-14%) scale(.97,1.05)}75%{transform:translateY(0) scale(1.04,.96)}}
@keyframes i-wave{from{transform:rotate(-8deg)}to{transform:rotate(-38deg)}}
@keyframes i-twinkle{from{opacity:.4}to{opacity:1}}
@keyframes i-giggle{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.iris.still *{animation:none!important;transition:none!important}

  const [x1, y1] = p(r2, a0), [x2, y2] = p(r2, a1), [x3, y3] = p(r1, a1), [x4, y4] = p(r1, a0);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r2},${r2} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${r1},${r1} 0 ${large} 0 ${x4.toFixed(1)},${y4.toFixed(1)}Z`;
}

/* ---------- 14 Action painting ---------- */
function dripPaint(seed = 5, n = 70) {
  const R = rng(seed), cols = ["#1B1B1B", "#F5F2EA", "#8C7B6B", "#C9B79C", "#5A6B7A", "#A0522D", "#1B1B1B", "#2A2A2A"];
  let s = "";
  for (let i = 0; i < n; i++) {
    let x = R() * 400, y = R() * 300, d = `M${x.toFixed(0)},${y.toFixed(0)}`;
    for (let k = 0; k < 4; k++) { const x2 = x + (R() * 220 - 110), y2 = y + (R() * 160 - 80); d += ` Q${(x + R() * 120 - 60).toFixed(0)},${(y + R() * 120 - 60).toFixed(0)} ${x2.toFixed(0)},${y2.toFixed(0)}`; x = x2; y = y2; }
    s += `<path d="${d}" stroke="${cols[Math.floor(R() * cols.length)]}" stroke-width="${(.8 + Math.pow(R(), 2) * 6).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
  }
  for (let i = 0; i < 90; i++) s += `<circle cx="${(R() * 400).toFixed(0)}" cy="${(R() * 300).toFixed(0)}" r="${(1 + R() * 4).toFixed(1)}" fill="${cols[Math.floor(R() * cols.length)]}"/>`;
  return s;
}
const artAction = () => svgWrap(`<rect width="400" height="300" fill="#E9E1CF"/>${dripPaint(5, 80)}`);

function pumpkin(dotCol = "#151515", withDots = true) {
  const u = uid(), R = rng(3);

  return `<defs><clipPath id="${u}c"><ellipse cx="140" cy="175" rx="48" ry="62"/><ellipse cx="200" cy="170" rx="54" ry="70"/><ellipse cx="260" cy="175" rx="48" ry="62"/><ellipse cx="170" cy="172" rx="44" ry="66"/><ellipse cx="230" cy="172" rx="44" ry="66"/></clipPath></defs>

/* change Iris's mood on a live svg, then return to her resting face */
function irisMood(target, mood, ms = 1300) {
  const svg = target && (target.tagName === "svg" ? target : target.querySelector("svg.iris"));
  if (!svg) return;
  svg.classList.forEach(c => { if (c.startsWith("mood-")) svg.classList.remove(c); });
  void svg.getBoundingClientRect();
  svg.classList.add("mood-" + mood);
  clearTimeout(svg._mt);
  if (ms) svg._mt = setTimeout(() => { svg.classList.forEach(c => { if (c.startsWith("mood-")) svg.classList.remove(c); }); svg.classList.add("mood-happy"); }, ms);
}
/* her eyes follow your finger or mouse */
(function eyeTracking() {
  let raf = 0, px = 0, py = 0;
  const update = () => {
    raf = 0;
    document.querySelectorAll("svg.iris:not(.still) .i-track").forEach(t => {
      const svg = t.ownerSVGElement, r = svg.getBoundingClientRect();
      if (!r.width) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height * .45;
      const dx = Math.max(-4, Math.min(4, (px - cx) / (r.width * .6) * 4)), dy = Math.max(-3.5, Math.min(3.5, (py - cy) / (r.height * .6) * 3.5));
      t.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`;
    });
  };
  // skip while a finger is painting on the board: no layout work during strokes
  document.addEventListener("pointermove", e => { if (e.buttons && e.target.closest && e.target.closest(".board, .pz-board")) return; px = e.clientX; py = e.clientY; if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
  document.addEventListener("pointerdown", e => { px = e.clientX; py = e.clientY; if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
})();

/* ---------- Islamic art: tile patterns ---------- */
const TILE_DEFAULT = ["#1D4ED8", "#FFFFFF", "#F2B705", "#138A36", "#C1654A"];
function starPts(cx, cy, ro, ri, n = 8, rot = 0) {

}
function islamicTile(x, y, s, fills, interactive, clipId) {

  const dia = [[50, 0], [100, 50], [50, 100], [0, 50]].map(([cx, cy]) => `<polygon points="${cx},${cy - 11} ${cx + 11},${cy} ${cx},${cy + 11} ${cx - 11},${cy}" fill="${fills[3]}" ${d(3)} stroke="#FFFFFF" stroke-width="2"/>`).join("");
  return `<g transform="translate(${x} ${y}) scale(${s})" clip-path="url(#${clipId})">
    <rect width="100" height="100" fill="${fills[0]}" ${d(0)}/>
    ${corner}${dia}

    <circle cx="50" cy="50" r="13" fill="${fills[2]}" ${d(2)} stroke="#FFFFFF" stroke-width="2"/>

}

  return t;

/* ---------- Art Nouveau: Gaudí's trencadís dragon ---------- */
const SALAMANDER = (() => {
  // the body is made of overlapping circles along a curvy spine, plus legs and a curled tail
  const C = [];
  const spine = t => [60 + t * 270, 160 + 34 * Math.sin(t * 5.2 - .6) - t * 10];
  for (let t = 0; t <= 1.0001; t += .012) {
    const [x, y] = spine(t);
    const r = t < .12 ? 36 - t * 40 : t < .45 ? 31 + Math.sin((t - .12) / .33 * Math.PI) * 17 : Math.max(6, 38 - (t - .45) * 58);
    C.push([x, y, r]);
  }
  const [ex, ey] = spine(1);
  for (let a = 0; a < 5.4; a += .25) { const r = 26 - a * 3.4; C.push([ex + 18 + Math.cos(a - 1.6) * r, ey - 8 + Math.sin(a - 1.6) * r, Math.max(3.5, 7 - a)]); }

    const [x, y] = spine(t), [x2, y2] = spine(t + .02), ang = Math.atan2(y2 - y, x2 - x) + side * Math.PI / 2;
    for (let k = 1; k <= 7; k++) C.push([x + Math.cos(ang) * (26 + k * 5) - (k * 3), y + Math.sin(ang) * (26 + k * 5), 10]);
    const fx = x + Math.cos(ang) * 64 - 22, fy = y + Math.sin(ang) * 64;
    [-1, 0, 1].forEach(d => C.push([fx + d * 9, fy + side * 6, 6]));
  });
  const inside = (x, y) => C.some(([cx, cy, r]) => (x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r);
  // jittered lattice -> irregular "broken tile" cells
  const R = rng(17), N = 30, M = 22, P = [];
  for (let j = 0; j <= M; j++) { P.push([]); for (let i = 0; i <= N; i++) P[j].push([i * 400 / N + (i % N ? (R() - .5) * 8 : 0), j * 300 / M + (j % M ? (R() - .5) * 8 : 0)]); }
  const cells = [];
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
    const q = [P[j][i], P[j][i + 1], P[j + 1][i + 1], P[j + 1][i]];

    if (inside(cx, cy)) {

    }

})();

/* ---------- Op Art: bulging checkerboard ---------- */
function opGrid(bulges = [{ x: 200, y: 150, r: 120, k: .55 }], cols = 20, rows = 15) {
  const warp = (x, y) => {
    let X = x, Y = y;
    bulges.forEach(b => { const dx = X - b.x, dy = Y - b.y, d = Math.hypot(dx, dy); if (d < b.r) { const f = 1 + b.k * Math.pow(1 - d / b.r, 2); X = b.x + dx * f; Y = b.y + dy * f; } });
    return [X, Y];
  };
  let s = "";
  const cw = 400 / cols, ch = 300 / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if ((i + j) % 2) continue;
    const q = [[i * cw, j * ch], [(i + 1) * cw, j * ch], [(i + 1) * cw, (j + 1) * ch], [i * cw, (j + 1) * ch]].map(([x, y]) => warp(x, y));
    s += `<polygon points="${q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" fill="#151515"/>`;
  }
  return `<rect width="400" height="300" fill="#F7F5EE"/>${s}`;
}

  { id: "ancient", label: "Ancient times", sub: "before 500 AD", test: y => y < 500, color: "#C8742F" },

  { id: "modern", label: "Modern times", sub: "1800 to today", test: y => y >= 1800, color: "#168AD8" }

function gameShell(title, back) {
  const scr = pageScreen(title, back);
  const wrap = el(`<div class="pg-wrap">
    <div class="pg-main"><div class="pg-head"><span class="ag-tag pg-round">Round 1</span><span class="pg-score"></span></div><div class="pg-board"></div></div>
    <div class="pg-side"><div class="talk"><div class="iris-mini">${irisNow("happy")}</div><div class="ag-bubble"><div class="ag-bubble__name"><span>Iris</span></div><div class="bubble-text"></div></div></div><div class="pg-answers"></div><div class="pg-next"></div></div></div>`);
  scr.appendChild(wrap); mount(scr);
  const ui = {
    board: $(".pg-board", wrap), answers: $(".pg-answers", wrap), next: $(".pg-next", wrap),
    say(t) { const b = $(".bubble-text", wrap); b.textContent = t; b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 }); },
    mood(m, ms = 1300) { irisMood($(".iris-mini", wrap), m, ms); },
    round(k, n) { $(".pg-round", wrap).textContent = `Round ${k} of ${n}`; },
    score(s, streak) { $(".pg-score", wrap).innerHTML = `${icon("star")}<b>${s}</b>${streak > 1 ? `<span class="streak">${streak} in a row!</span>` : ""}`; },
    nextBtn(label, fn) { ui.next.innerHTML = ""; const b = el(`<button class="ag-btn ag-btn--sun ag-btn--block pulse">${esc(label)}</button>`); b.onclick = () => { FX.tap(); fn(); }; ui.next.appendChild(b); }

}
function scoreResult(name, score, total, again) {
  const stars = score >= total * .9 ? 3 : score >= total * .6 ? 2 : 1, drops = Math.max(5, score);
  FX.win(); confetti(score >= total * .6 ? 100 : 40);
  modal({
    title: `${name}: ${score} out of ${total}!`, closable: false,
    body: `<div style="width:120px">${irisNow("cheer")}</div><div class="reward-stars">${[0, 1, 2].map(k => icon(k < stars ? "star" : "starIdle", "pop")).join("")}</div><div class="big-num">+${drops}</div><p>paint drops! ${stars === 3 ? "You are a real art historian!" : "Play again to beat your score."}</p>`,
    buttons: [{ label: "Arcade", cls: "ag-btn--white", onClick: showArcade }, { label: "Play again", cls: "ag-btn--sun", onClick: again }]
  });
  setTimeout(() => addDrops(drops), 500);
  const best = S.best[name] || 0; if (score > best) { S.best[name] = score; save(); }
}

/* ---------- Name that Period ---------- */
function showNamePeriod(level = "easy") {
  const ui = gameShell("Name that Period", showArcade);
  const N = 10, rounds = shuffle(ERAS.map(e => e.id)).slice(0, N), nOpt = level === "easy" ? 3 : 4;
  let k = 0, score = 0, streak = 0;
  ui.board.insertAdjacentHTML("beforebegin", `<div class="pg-level"></div>`);
  chipsUI($(".pg-level"), "Level", [{ id: "easy", label: "3 choices" }, { id: "hard", label: "4 choices" }], level, id => showNamePeriod(id));
  function round() {
    const id = rounds[k], era = ERAS.find(e => e.id === id);
    const others = shuffle(ERAS.filter(e => e.id !== id)).slice(0, nOpt - 1);
    const opts = shuffle([era, ...others]);
    ui.round(k + 1, N); ui.score(score, streak); ui.next.innerHTML = ""; ui.mood("think", 0);
    ui.board.innerHTML = `<div class="pg-art">${artSVG(id)}</div>`;
    ui.say("Which art period is this masterpiece from?");
    ui.answers.innerHTML = "";
    opts.forEach(o => {
      const b = el(`<button class="ag-btn ag-btn--white answer pg-opt"><span class="dot" style="background:${o.iris}"></span><span><b>${esc(o.name)}</b><small>${esc(o.when)}</small></span></button>`);
      b.onclick = () => {
        if (ui.answers.dataset.locked) return; ui.answers.dataset.locked = "1";
        const ok = o.id === id;
        if (ok) { score++; streak++; b.classList.add("right"); FX.chime(); confetti(26); ui.mood("cheer", 1500); }
        else { streak = 0; b.classList.add("wrong"); FX.soft(); ui.mood("oops", 1500); $$(".pg-opt", ui.answers)[opts.indexOf(era)].classList.add("right"); }
        ui.score(score, streak);
        ui.board.insertAdjacentHTML("beforeend", `<div class="plaque"><h3>${esc(era.work.title)}</h3><p>${esc(era.work.artist)} · ${esc(era.work.year)}</p><span></span><div class="where">${esc(era.name)} · ${esc(era.when)}</div></div>`);
        ui.say(ok ? (streak > 2 ? `${streak} in a row! You're on fire!` : "Yes! Well spotted!") : `This one is from ${era.name}. Now you know!`);
        ui.nextBtn(k < N - 1 ? "Next painting" : "See my score", () => { delete ui.answers.dataset.locked; k++; k < N ? round() : scoreResult("Name that Period", score, N, () => showNamePeriod(level)); });
      };
      ui.answers.appendChild(b);
    });
  }
  round();
}

/* ---------- Art Detective ---------- */
function showDetective() {
  const ui = gameShell("Art Detective", showArcade);
  const N = 6, rounds = shuffle(ERAS.map(e => e.id)).slice(0, N);
  let k = 0, score = 0, streak = 0;
  function round() {
    const era = ERAS.find(e => e.id === rounds[k]);
    const clues = [`Made with: ${era.madeWith}`, `Where: ${era.where}`, `When: ${era.when}`, `A famous artist: ${era.artists[0].name}`];
    const picks = shuffle([era, ...shuffle(ERAS.filter(e => e.id !== era.id)).slice(0, 3)]);
    let shown = 1, done = false;
    ui.round(k + 1, N); ui.score(score, streak); ui.next.innerHTML = ""; ui.mood("think", 0);
    const draw = () => {
      ui.board.innerHTML = `<div class="clues">${clues.map((c, i) => `<div class="clue ${i < shown ? "on" : ""}"><span class="cn">Clue ${i + 1}</span>${i < shown ? esc(c) : "?"}</div>`).join("")}</div>`;
    };
    draw();
    ui.say(`Read the clue, then tap the masterpiece it describes. Fewer clues means more stars!`);
    ui.answers.innerHTML = `<div class="det-grid">${picks.map((p, i) => `<button class="det-card" data-i="${i}" aria-label="${esc(p.work.title)}">${artSVG(p.id)}</button>`).join("")}</div>`;
    const more = el(`<button class="chip" style="margin-top:12px">${icon("eye")}Show another clue</button>`);
    more.onclick = () => { if (shown < 4 && !done) { shown++; draw(); FX.tap(); } };
    ui.answers.appendChild(more);
    $$(".det-card", ui.answers).forEach(b => b.onclick = () => {
      if (done) return;
      const p = picks[+b.dataset.i];
      if (p.id === era.id) {
        done = true; const pts = 5 - shown; score += pts; streak++; b.classList.add("ok"); FX.chime(); confetti(30); ui.mood("cheer", 1500);
        shown = 4; draw();
        ui.say(`Case solved! It's ${era.work.title}, from ${era.name}. +${pts} star${pts > 1 ? "s" : ""}!`); ui.score(score, streak);
        ui.nextBtn(k < N - 1 ? "Next case" : "See my score", () => { k++; k < N ? round() : scoreResult("Art Detective", score, N * 4, showDetective); });
      } else {
        streak = 0; b.classList.add("no"); b.disabled = true; FX.soft(); ui.mood("oops", 1200);
        if (shown < 4) { shown++; draw(); ui.say("Not that one. Here's another clue!"); } else ui.say("Not that one. Try another picture!");
        ui.score(score, streak);
      }
    });
  }
  round();
}

  const stampRow = chipsUI(tools, "Stamp", [{ id: "star", label: "Star" }, { id: "heart", label: "Heart" }, { id: "flower", label: "Flower" }, { id: "circle", label: "Dot" }], "star", id => P.stamp = id);
  stampRow.hidden = true;
  paletteUI(tools, ["#D93A3F", "#FF8C1A", "#FFD21F", "#B5E83A", "#3B9512", "#36ACF8", "#1D4ED8", "#7A4BE0", "#F57EBF", "#8A5A2B", "#151515", "#FFFFFF"], P.color, c => P.color = c, { label: "Colors" });
  chipsUI(tools, "Size", SIZES, "m", id => P.size = { s: 7, m: 14, l: 26 }[id]);
  $(".clr", wrap).onclick = () => { FX.swoosh(); P.clear(); };
  $(".sv", wrap).onclick = () => {
    if (saved) { toast("Already in your museum!"); return; }
    S.gallery.push({ id: Date.now(), era: "studio", title: "My masterpiece", when: "Free Paint Studio", src: P.snapshot() });
    if (S.gallery.length > 40) S.gallery.shift();
    save(); saved = true; FX.chime(); confetti(40); toast("Saved to My Museum!");
  };

}

/* ---------- My Museum ---------- */
function showMuseum() {
  const scr = pageScreen("My Museum", () => showMap(false));
  const items = S.gallery.slice().reverse();
  const page = el(`<div class="page"><div class="page-hero"><div class="hero-iris">${irisNow("happy")}</div><h2>My Museum</h2></div><p class="lead">Every artwork you make is hung here. Tap one to look closer.</p>
    ${items.length ? `<div class="museum-wall">${items.map(g => `<button class="museum-item" data-id="${g.id}"><div class="fr"><img src="${g.src}" alt="${esc(g.title)}"></div><b>${esc(g.title)}</b><small>${esc(g.when)}</small></button>`).join("")}</div>` : `<div class="empty">Your walls are empty for now. Finish a stop on the timeline or paint in the studio, and your art will appear here!</div>`}
    <div class="section-title">Masterpiece sticker book · ${S.stars.filter(s => s > 0).length} of ${ERAS.length}</div>
    <div class="sticker-book">${ERAS.map((e, i) => `<button class="sb-item ${S.stars[i] ? "" : "locked"}" data-i="${i}" style="border:0;background:none;cursor:pointer;--r:${(i % 3 - 1) * 3}deg"><div class="sticker">${artImg(e.id)}</div>${S.stars[i] ? esc(e.work.title) : "?"}</button>`).join("")}</div></div>`);
  scr.appendChild(page); mount(scr);
  $$(".museum-item", page).forEach(b => b.onclick = () => {
    const g = S.gallery.find(x => String(x.id) === b.dataset.id); if (!g) return;
    FX.pop();
    modal({
      title: g.title, body: `<img src="${g.src}" alt="" style="width:100%;border:8px solid #B5651D;border-radius:6px"><p>${esc(g.when)}</p>`,
      buttons: [{ label: "Take it down", cls: "ag-btn--white", icon: "trash", onClick: () => modal({ title: "Take it down?", body: `<p>This artwork will be removed from your museum.</p>`, buttons: [{ label: "Keep it", cls: "ag-btn--white" }, { label: "Take it down", cls: "ag-btn--berry", onClick: () => { S.gallery = S.gallery.filter(x => x.id !== g.id); save(); showMuseum(); } }] }) }, { label: "Close", cls: "ag-btn--sky" }]
    });
  });
  $$(".sb-item", page).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, e = ERAS[i];
    if (!S.stars[i]) { FX.soft(); toast(`Visit ${e.name} on the timeline to win this sticker!`); return; }
    FX.pop();
    modal({ title: e.work.title, body: `<div style="width:100%;border-radius:12px;overflow:hidden">${artSVG(e.id)}</div><p><b>${esc(e.work.artist)}</b> · ${esc(e.work.year)}<br>${esc(e.work.place)}</p>`, buttons: [{ label: "Close", cls: "ag-btn--sky" }] });
  });
}

/* ---------- Iris's closet ---------- */
function showCloset(tab = "hats") {
  const scr = pageScreen("Iris's Closet", () => showMap(false));
  const TABS = { hats: "Hats", glasses: "Glasses", neck: "Neck", smock: "Smocks" };
  const wrap = el(`<div class="closet"><div class="dressing"><span class="lamp" style="left:18%"></span><span class="lamp" style="right:18%"></span><div class="iris-dress">${irisNow("happy")}</div></div>
    <div class="closet-side"><div class="ag-tabs" role="tablist">${Object.keys(TABS).map(k => `<button class="ag-tab" role="tab" aria-selected="${k === tab}" data-t="${k}">${TABS[k]}</button>`).join("")}</div>
    <div class="ag-tray" role="listbox"></div></div></div>`);
  scr.appendChild(wrap); mount(scr);
  const tray = $(".ag-tray", wrap);
  function render() {
    tray.innerHTML = CLOSET[tab].map(it => {
      const own = S.owned[tab].includes(it.id), wearing = S.wear[tab] === it.id;
      const prevOutfit = Object.assign({}, S.wear, { [tab]: it.id });
      return `<button class="ag-tile ${wearing ? "is-selected" : ""}" role="option" aria-selected="${wearing}" data-id="${it.id}"><span class="prev">${irisSVG({ outfit: prevOutfit, still: true })}</span><span class="nm">${esc(it.name)}</span>${own ? `<span class="ck">${icon(wearing ? "check" : "checkIdle")}</span>` : `<span class="ag-price">${icon("drop")}${it.price}</span>`}</button>`;
    }).join("");
    $$(".ag-tile", tray).forEach(b => b.onclick = () => {
      const cat = tab, it = CLOSET[cat].find(x => x.id === b.dataset.id);
      if (S.owned[cat].includes(it.id)) { S.wear[cat] = it.id; save(); FX.pop(); $(".iris-dress", wrap).innerHTML = irisNow("wow"); setTimeout(() => { const d = $(".iris-dress", wrap); if (d) d.innerHTML = irisNow("happy"); }, 500); render(); return; }
      if (S.drops < it.price) { FX.soft();toast(`You need ${it.price - S.drops} more paint drops`); return; }
      modal({
        title: "Buy " + it.name + "?", body: `<div style="width:160px">${irisSVG({ outfit: Object.assign({}, S.wear, { [cat]: it.id }), mood: "grin" })}</div><p>It costs ${it.price} paint drops. You have ${S.drops}.</p>`,
        buttons: [{ label: "Not now", cls: "ag-btn--white" }, { label: "Buy it!", cls: "ag-btn--sun", onClick: () => { S.drops -= it.price; S.owned[cat].push(it.id); S.wear[cat] = it.id; save(); FX.coin(); confetti(40); toast("Iris will wear it everywhere: on the map, in every lesson and in the games!", 3000); $$(".ag-counter.drops").forEach(c => $("b", c).textContent = S.drops); $(".iris-dress", wrap).innerHTML = irisNow("wow"); render();} }]
      });
    });
  }
  $$(".ag-tab", wrap).forEach(t => t.onclick = () => { tab = t.dataset.t; $$(".ag-tab", wrap).forEach(x => x.setAttribute("aria-selected", x === t)); FX.tap(); render(); });
  render();

}

/* ---------- Certificate ---------- */
function showCertificate() {
  const scr = pageScreen("You did it!", () => showMap(false));
  const total = S.stars.reduce((a, b) => a + b, 0);
  const page = el(`<div class="page"><div class="cert">
    <span class="hello">Certificate</span><h2 class="ag-logo" style="font-size:44px">Young Art Historian</h2>
    <p class="lead" style="margin:0">This is to say that</p><div class="who">Melissa</div>
    <p class="lead" style="margin:0">traveled 40,000 years through art history with Iris the chameleon, visited all ${ERAS.length} stops and earned ${total} stars!</p>
    <div class="row">${ERAS.map(e => `<div class="sticker">${artImg(e.id)}</div>`).join("")}</div>
    <div style="width:140px">${irisNow("cheer")}</div>
    <div class="dlg-btns" style="max-width:520px"><button class="ag-btn ag-btn--white go-m">${icon("museum")}My Museum</button><button class="ag-btn ag-btn--sun go-a">${icon("arcade")}Art Arcade</button></div>
  </div></div>`);
  scr.appendChild(page); mount(scr);
  $(".go-m", page).onclick = () => { FX.pop(); showMuseum(); };
  $(".go-a", page).onclick = () => { FX.pop(); showArcade(); };
  FX.win(); confetti(140);

}

/* ---------- boot ---------- */
save();
S.gallery.forEach(compactArt); // shrink pictures saved by older versions
showTitle();
document.addEventListener("pointerdown", () => FX.get(), { once: true });
</script>
